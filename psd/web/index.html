    --rail: #3d8fd6; --accent: #6fb0ec; --accent-soft: #1a2a3b; --on-accent: #0b1520;
    --red: #f2675d; --red-soft: #3a1f1d; --amber: #f0b43c; --amber-dot: #f0b43c; --amber-soft: #3a2f18;
    --green: #5cc08f; --green-soft: #183224; --gray: #8f99a6; --gray-soft: #252e39;
    --scroll-edge: rgba(255, 255, 255, .16);

  }
}

:root[data-theme="dark"] {

  --rail: #3d8fd6; --accent: #6fb0ec; --accent-soft: #1a2a3b; --on-accent: #0b1520;

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--hdr); color: #fff; }

.themebtn { appearance: none; border: 0; font: inherit; font-size: 0.56rem; font-weight: 600; letter-spacing: 0.06em; line-height: 1; display: inline-flex; flex-direction: column; align-items: center; gap: 3px; padding: 2px; border-radius: 4px; cursor: pointer; white-space: nowrap; background: none; color: #fff; }

.themebtn[aria-checked="true"] .sw { background: #2bbd5e; }

.tab { appearance: none; border: 0; background: none; font: inherit; font-size: 0.93rem; font-weight: 700; color: #fff; opacity: .8; padding: 7px 14px; border-radius: 3px; cursor: pointer; white-space: nowrap; }

.view { display: flex; flex-direction: column; gap: 20px; padding-top: 24px; }

/* 현황: 노선도 */
.map { background: var(--surface-2); border-radius: 4px; padding: 20px 24px 18px; display: flex; flex-direction: column; gap: 12px; }

/* 기간 버튼은 한 줄을 다 쓰고, 역·부품 선택은 다음 줄에 같이 둔다(선택 하나만 따로 떨어지지 않게) */
.horizon { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-basis: 100%; }

.item { appearance: none; background: none; border: 0; border-bottom: 1px solid var(--line); font: inherit; color: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 8px 120px minmax(0, 1fr) 100px 76px; align-items: center; gap: 16px; padding: 12px 4px 12px 0; }
.item:hover { background: var(--surface-2); }
.item .bar { width: 8px; height: 38px; border-radius: 2px; background: var(--line); }
.item.r .bar { background: var(--red); } .item.y .bar { background: var(--amber-dot); } .item.c .bar { background: var(--gray); }
.item .s { font-size: 1.05rem; font-weight: 800; }
.item .p { min-width: 0; } .item .p b { font-weight: 700; } .item .p span { display: block; font-size: 0.8rem; color: var(--muted); }

@media (max-width: 640px) {

.vchart svg { display: block; width: 100%; height: auto; overflow: visible; }

.st:hover { background: var(--accent-soft); }

.scroll {
  overflow-x: auto;

    linear-gradient(to right, var(--surface) 30%, rgba(255, 255, 255, 0)),

.list { display: flex; flex-direction: column; }

<script>
(function () {
  "use strict";

  // ---------- API ----------
  async function api(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error((await r.text()) || (path + " 실패"));
    return r.json();
  }
  async function apiPost(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Array.isArray(data.detail) ? data.detail.map(d => d.msg).join(", ") : (data.detail || (path + " 실패")));
    return data;
  }
  async function apiUpload(path, file) {
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch(path, { method: "POST", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = data.detail;
      const msg = d && typeof d === "object" && d.errors ? `${d.message}: ${d.errors.slice(0, 8).join(" / ")}${d.errors.length > 8 ? " ..." : ""}` : (typeof d === "string" ? d : (path + " 실패"));
      throw new Error(msg);
    }
    return data;
  }

  // 부품 종류: 화면 표시용 고정 목록(이름·단위). 값은 아니라 한 번만 받아 둔다
  let PART_TYPES = [], PART = {}, DOOR_PART_CODES = [], STATION_PART_CODES = [];
  async function loadPartTypes() {
    if (PART_TYPES.length) return;
    const { part_types } = await api("/api/part-types");
    PART_TYPES = part_types;
    PART = Object.fromEntries(PART_TYPES.map(p => [p.code, p]));
    DOOR_PART_CODES = PART_TYPES.filter(p => p.unit === "door").map(p => p.code);
    STATION_PART_CODES = PART_TYPES.filter(p => p.unit === "station").map(p => p.code);
  }

  const REASONS = { fail: "고장", prev: "예방 교체", with: "함께 교체", check: "점검(이상 없음)" };
  const STATE = { 빨강: ["위험", "s-red"], 노랑: ["주의", "s-amber"], 초록: ["안전", "s-green"], 확인_필요: ["확인 필요", "s-check"] };
  const RANK = { 빨강: 0, 확인_필요: 1, 노랑: 2, 초록: 3 };
  // 판정은 주기 계산 결과라 상태색(빨강=위험, 노랑=주의, 초록=안전)을 쓰지 않는다. "안전" 옆에 빨간 "짧음 확실"이 붙어 위험처럼 보였다
  const JUDGE = {
    같음: ["10년과 같음", "s-check", "비중을 어떻게 잡아도 10년과 0.5년 이내로 차이 납니다."],
    짧음_확실: ["짧음 확실", "s-info", "원인 비중을 어떻게 잡아도 10년보다 짧습니다."],
    김_확실: ["김 확실", "s-check", "원인 비중을 어떻게 잡아도 10년보다 깁니다. 10년보다 늦은 교체는 권고하지 않고 참고로만 보여 줍니다."],
    불확실: ["불확실", "s-check", "원인 비중에 따라 10년보다 짧게도, 길게도 나옵니다."],
    날씨무관: ["날씨 보정 없음", "s-check", "날씨가 수명을 줄인다는 정량 근거를 찾지 못해 제조사 권장 10년을 씁니다."]
  };
  const SRC = {
    DCM: [["Nichicon 콘덴서 수명 계산기", "https://www.nichicon.com/en-us/design-support/lifetime-calculator/"], ["Norris-Landzberg 납땜 피로", "https://accendoreliability.com/norris-landzberg-solder-joint-fatigue/"], ["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    IFM: [["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    MOTOR: [["NSWC-98 식 14-4 권선 온도 계수", "https://everyspec.com/USN/NSWC/NSWC-98_RELIABILITY_HDBK_SEP1998_55321/"]]
  };

  // ---------- 유틸 ----------
  function fmtDateKR(s) { const [y, m, d] = s.split("-").map(Number); return `${y}년 ${m}월 ${d}일`; }
  function dailyTrips(interval) {
    const SERVICE_SPAN_MIN = 18.5 * 60; // 첫차 05:30~막차 24:00 가정(상세 운행시간표 미확보, 추정)
    const PEAK_MIN = 4 * 60; // 출퇴근 피크 합 4시간(아침·저녁 2시간씩) 가정
    const offpeakMin = SERVICE_SPAN_MIN - PEAK_MIN;
    return Math.round(PEAK_MIN / interval.peak + offpeakMin / interval.offpeak);
  }
  function openLabel(station) { return station.id === 24 ? "2026년 9월(일자 미정)" : fmtDateKR(station.open_date); }
  function yr(x) { return x.toFixed(1) + "년"; }
  function dur(days) {
    const a = Math.abs(days), m = Math.round(a / 30.44);
    const t = m >= 12 ? Math.floor(m / 12) + "년" + (m % 12 ? " " + (m % 12) + "개월" : "") : (m ? m + "개월" : a + "일");
    return days < 0 ? t + " 지남" : t + " 남음";
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function pill(status) { return `<span class="pill ${STATE[status][1]}">${STATE[status][0]}</span>`; }
  function jpill(j) { return `<span class="pill ${JUDGE[j][1]}">${JUDGE[j][0]}</span>`; }
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2400); }
  function worstDoor(doors) { return doors.reduce((a, d) => (RANK[d.worst_status] < RANK[a.worst_status] || (RANK[d.worst_status] === RANK[a.worst_status] && d.worst_days_left < a.worst_days_left)) ? d : a); }
  // 주기 차이(년)를 "1년 2개월"처럼. 부호는 버리고 호출하는 쪽에서 "빨라짐/늦어짐"을 붙인다
  function monthsText(dy) {
    const m = Math.round(Math.abs(dy) * 12);
    return m >= 12 ? Math.floor(m / 12) + "년" + (m % 12 ? " " + (m % 12) + "개월" : "") : m + "개월";
  }
  function dotDate(s) { return s.replaceAll("-", "."); }
  // 가로 막대 비교(항상 0년부터 — 막대 길이로 크기를 비교하므로). rows = [[이름, 년, "b0"|"b1"]], refs = [[년, 이름]].
  // SVG로 그리면 좁은 카드에서 글자까지 같이 줄어 읽기 힘들어서 HTML로 그린다(글자 크기 고정)
  function cmpSvg(rows, refs, aria) {
    const max = Math.max(10.5, ...rows.map(r => r[1]), ...refs.map(r => r[0]));
    const at = v => `calc((100% - 52px) * ${(v / max).toFixed(4)})`;
    const n = rows.length;
    const ov = refs.length ? `<span class="cmp-ov" style="grid-row:1 / ${n + 2}">${refs.map(([v, t]) => `<i style="left:${at(v)}"><em>${esc(t)}</em></i>`).join("")}</span><span class="cmp-hd" style="grid-row:1"></span>` : "";

  // ---------- 교체 예정 전체(현황 "전체 보기") ----------
  async function vWork() {
    const h = HORIZONS.some(x => x[0] === view.h) ? view.h : 730;
    const hLabel = HORIZONS.find(x => x[0] === h)[1];
    // 가장 긴 기간(3년)을 한 번 받아 두고 기간별로 잘라 쓴다 — 버튼마다 건수를 미리 보여 주려고.
    // 3년은 윤년이 끼면 1096일이라 넉넉히 받는다
    const [wi, data] = await Promise.all([api("/api/work-items?within_days=1100"), api("/api/stations")]);
    const endOf = d => addMonths(wi.today, HORIZONS.find(x => x[0] === d)[2]);
    const inHorizon = (x, d) => x.status !== "초록" || x.days_left <= daysBetween(wi.today, endOf(d));  // 위험·확인 필요·주의는 기간과 상관없이 늘 포함(API와 같은 규칙)
    const byFilter = wi.items.filter(x => (!view.fst || x.station_id === view.fst) && (!view.fpart || x.part_type_code === view.fpart));
    const items = byFilter.filter(x => inHorizon(x, h));
    const filtered = byFilter.length !== wi.items.length;
    const opened = data.stations.filter(s => s.in_service);

    const filters = `<div class="filters">
        <div class="horizon"><div class="seg" role="group" aria-label="교체 예정일 기간">${HORIZONS.map(([d, l]) => {
          const n = byFilter.filter(x => inHorizon(x, d)).length;
          return `<button class="segbtn hbtn" aria-pressed="${d === h}" ${goAttr({ ...view, h: d, keep: true })}>${l} 안<small>${n}건</small></button>`;
        }).join("")}</div></div>
        <select id="w-st" aria-label="역으로 거르기"><option value="">모든 역</option>${opened.map(s => `<option value="${s.id}" ${s.id === view.fst ? "selected" : ""}>${s.name}</option>`).join("")}</select>
        <select id="w-part" aria-label="부품으로 거르기"><option value="">모든 부품</option>${PART_TYPES.map(p => `<option value="${p.code}" ${p.code === view.fpart ? "selected" : ""}>${p.name}</option>`).join("")}</select>
      </div>`;
    // 목록이 비면 통째로 사라져 헷갈리므로, 그 자리에 "없음"을 적는다
    const empty = `<div class="items-empty"><b>${filtered ? "고른 조건에" : `${hLabel} 안에`} 교체할 부품이 없습니다.</b></div>`;
    return `<section class="view">
      <nav class="crumbs"><button ${goAttr({ name: "home" })}>현황</button><span>›</span><span>교체 예정 전체</span></nav>
      <h2>교체 예정 전체</h2>
      ${filters}
      <div class="items">${items.length ? items.map(workRow).join("") : empty}</div>
    </section>`;
  }

  // ---------- 역 목록 ----------
  async function vRoute() {
    const data = await api("/api/stations");
    const item = s => {
      const c = s.counts;
      const b = [c.빨강 ? `<span class="pill s-red">위험 ${c.빨강}</span>` : "", c.확인_필요 ? `<span class="pill s-check">확인 ${c.확인_필요}</span>` : "", c.노랑 ? `<span class="pill s-amber">주의 ${c.노랑}</span>` : ""].join("");
      // in_service가 false면(지금은 북울산) 부품 자체가 없어 counts가 전부 0이다 — "안전"으로
      // 잘못 보여주면 안 된다(코드 리뷰로 찾은 버그). 운영 중 역만 그 fallback을 쓴다.
      const fallback = s.in_service ? '<span class="pill s-green">안전</span>' : '<span class="pill s-check">개통 전</span>';
      const meta = s.next ? `다음 교체 ${s.next.due} ${PART[s.next.part_type_code].name} · ${dur(s.next.days_left)}` : `${openLabel(s)} 개통 예정`;
      return `<li data-name="${esc(s.name)}"><button class="st" ${goAttr({ name: "station", st: s.id })}><span class="body"><span class="name">${s.name}</span><span class="meta">${meta}</span></span><span class="badges">${b || fallback}</span><span class="chev" aria-hidden="true">›</span></button></li>`;
    };
    return `<section class="view">
      ${legend}
      <div class="stfilter-wrap"><input type="search" id="st-filter" class="stfilter" placeholder="역 이름으로 찾기 (예: 태화강)" aria-label="역 이름으로 찾기"></div>

      <p class="route-empty" id="route-empty" hidden>"<span id="route-empty-q"></span>" 역이 없습니다.</p>
    </section>`;

  // ---------- 교체 기록(입력·업로드·보고서) ----------
  // 마지막 업로드(또는 되돌리기) 결과. 교체 기록 화면 맨 위에 "무엇이 바뀌었는지"로 보여 준다
  let lastResult = null;
  function changeCard(c, kind) {
    const b = c.before, a = c.after, d = a.years - b.years;
    const tag = Math.abs(d) < 0.05 ? `<span class="pill s-check">주기 변화 거의 없음</span>` : `<span class="pill s-info">교체주기 ${monthsText(d)} ${d < 0 ? "짧아짐" : "길어짐"}</span>`;
    const st = ["빨강", "노랑", "확인_필요", "초록"].filter(s => b.counts[s] || a.counts[s])
      .map(s => `<span>${pill(s)} ${b.counts[s]} → <b>${a.counts[s]}</b></span>`).join("");
    return `<div class="chg">
        <div class="chg-title"><h3>${esc(c.station_name)} · ${esc(c.part_name)}</h3>${tag}</div>
        <div class="chg-big" aria-label="교체주기 ${yr(b.years)}에서 ${yr(a.years)}로"><span class="old">${yr(b.years)}</span><span class="arr" aria-hidden="true">→</span><span class="new">${yr(a.years)}</span></div>
        ${cmpSvg(kind === "undo" ? [["되돌리기 전", b.years, "b0"], ["되돌린 뒤", a.years, "b1"]] : [["올리기 전", b.years, "b0"], ["올린 뒤", a.years, "b1"]], cycleRefs(a.formula_years), `${c.station_name} ${c.part_name} 교체주기 비교`)}
        <dl class="facts">
          <dt>고장 기록</dt><dd>${b.failures}건 → <b>${a.failures}건</b> <span class="muted small">(부품 ${a.parts}개)</span></dd>
          <dt>가장 빠른 교체</dt><dd>${dotDate(b.next_due)} → <b>${dotDate(a.next_due)}</b> <span class="muted small">(${dur(a.days_left)})</span></dd>
        </dl>
        <div class="stchg">${st}</div>
        <button class="linkbtn" ${goAttr({ name: "station", st: c.station_id })}>${esc(c.station_name)}역 문별 상태 보기 ›</button>
      </div>`;
  }
  function resultPanel(r) {
    const shown = r.changes.slice(0, 6), rest = r.changes.slice(6);
    const sub = `<p class="small muted">${r.checked ? `교체 ${r.replaced.toLocaleString()}건 · 점검(이상 없음) ${r.checked.toLocaleString()}건 · ` : ""}${esc(r.file || "")}</p>`;
    const head = r.kind === "upload" ? `<h2>${r.inserted.toLocaleString()}건을 저장하고 교체주기를 다시 계산했습니다</h2>${sub}`
      : r.kind === "preview" ? `<h2>${r.inserted.toLocaleString()}건을 올리면 ${r.changes.length}곳의 교체주기가 이렇게 바뀝니다</h2>${sub}`
      : `<h2>${r.deleted.toLocaleString()}건을 되돌렸습니다</h2>`;
    const restRows = rest.map(c => `<tr><td>${esc(c.station_name)}</td><td>${esc(c.part_name)}</td><td class="num">${yr(c.before.years)} → <b>${yr(c.after.years)}</b></td><td class="num">${dotDate(c.before.next_due)} → ${dotDate(c.after.next_due)}</td></tr>`).join("");
    return `<div class="panel result" id="result">
        <div class="resulthead"><div>${head}</div>${r.kind === "preview" ? "" : `<div class="filters">${r.kind === "upload" ? `<button class="btn ghost" id="res-undo" type="button">이 업로드 되돌리기</button>` : ""}<button class="linkbtn" id="res-close" type="button">닫기</button></div>`}</div>
        <div class="chgs">${shown.map(c => changeCard(c, r.kind)).join("")}</div>
        ${rest.length ? `<details class="more"><summary>나머지 ${rest.length}곳 보기</summary><div class="scroll"><table><tr><th>역</th><th>부품</th><th>교체주기</th><th>가장 빠른 교체</th></tr>${restRows}</table></div></details>` : ""}
      </div>`;
  }
  // ---------- 정비기록 시연: 샘플 엑셀(입력)을 올리면 결과가 어떻게 바뀌는지. 미리보기라 저장하지 않는다 ----------

  async function vStation() {
    const st = view.st;

    if (!detail.station.in_service) {
      const s = detail.station;
      const prev = list.stations.find(x => x.id === st - 1), next = list.stations.find(x => x.id === st + 1);

          <button class="swbtn" ${prev ? goAttr({ name: "station", st: prev.id }) : "disabled"}>‹ ${prev ? prev.name : "이전 역 없음"}</button>
          <select id="st-jump" aria-label="다른 역으로 이동">${list.stations.map(x => `<option value="${x.id}" ${x.id === st ? "selected" : ""}>${x.id}. ${x.name}</option>`).join("")}</select>
          <button class="swbtn" ${next ? goAttr({ name: "station", st: next.id }) : "disabled"}>${next ? next.name : "다음 역 없음"} ›</button>

      return `<section class="view">
        <nav class="crumbs"><button ${goAttr({ name: "route" })}>역 목록</button><span>›</span><span>${s.name}</span></nav>

          <p class="muted">${openLabel(s)} 개통 예정 · 아직 스크린도어(PSD)가 설치되지 않아 교체주기를 계산할 대상이 없습니다.</p>

    const dirTabs = `<div class="dirtabs" role="group" aria-label="방향 선택">${Object.entries(SIDE_LABEL).map(([k, v]) => `<button class="dirtab" aria-pressed="${k === sid}" ${goAttr({ name: "station", st, side: k, keep: true })}>${v}</button>`).join("")}</div>`;

    drop.addEventListener("dragleave", () => drop.classList.remove("over"));

  // ---------- 날씨 영향 ----------
  const WPARTS = ["DCM", "IFM", "MOTOR"];
  function niceTicks(lo, hi, n) {
    const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
    const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= n) || mag * 10;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function dotCell(v, lo, hi, ref, tipT, tipR, label) {
    const W = 120, H = 22, x = t => (6 + (t - lo) / (hi - lo) * (W - 12)).toFixed(1);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><line class="refl" x1="${x(ref)}" x2="${x(ref)}" y1="3" y2="19"/><circle class="dot" cx="${x(v)}" cy="11" r="4.5"/></svg>`;
  }
  function rangeCell(c, lo, hi, tipT, tipR, label) {
    const W = 120, H = 22, x = t => 6 + (t - lo) / (hi - lo) * (W - 12);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><rect class="band" x="${x(c.lo).toFixed(1)}" y="8" width="${Math.max(2, x(c.hi) - x(c.lo)).toFixed(1)}" height="6" rx="3"/><line class="refl" x1="${x(10).toFixed(1)}" x2="${x(10).toFixed(1)}" y1="3" y2="19"/><circle class="dot" cx="${x(c.base).toFixed(1)}" cy="11" r="4.5"/></svg>`;
  }
  function cc(cyc) { return { base: cyc.base_years, lo: cyc.lo_years, hi: cyc.hi_years, j: cyc.judgment }; }
  function scatter(title, stations, key, xLabel, code, fmtX) {
    const W = 440, H = 280, m = { l: 44, r: 16, t: 26, b: 44 };
    const pts = stations.map(s => ({ s, x: s.weather[key], c: cc(s.cycles[code]) }));
    const xs = pts.map(p => p.x), pad = (Math.max(...xs) - Math.min(...xs)) * 0.08 || 1;
    const xlo = Math.min(...xs) - pad, xhi = Math.max(...xs) + pad;
    const ylo = Math.min(9.5, Math.floor(Math.min(...pts.map(p => p.c.lo)) * 2) / 2), yhi = Math.max(10.5, Math.ceil(Math.max(...pts.map(p => p.c.hi)) * 2) / 2);
    const X = v => m.l + (v - xlo) / (xhi - xlo) * (W - m.l - m.r), Y = v => H - m.b - (v - ylo) / (yhi - ylo) * (H - m.t - m.b);
    const f = v => v.toFixed(1);
    const minP = pts.reduce((a, b) => b.c.base < a.c.base ? b : a), maxP = pts.reduce((a, b) => b.c.base > a.c.base ? b : a);
    const lab = p => { const x = X(p.x), right = x > W / 2; return `<text class="lab" x="${f(right ? x - 9 : x + 9)}" y="${f(Y(p.c.base) - 7)}" text-anchor="${right ? "end" : "start"}">${esc(p.s.name)}</text>`; };
    return `<figure><figcaption>${title}</figcaption>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
        ${niceTicks(ylo, yhi, 5).map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${m.l - 6}" y="${f(Y(v) + 4)}" text-anchor="end">${v}</text>`).join("")}
        ${niceTicks(xlo, xhi, 5).map(v => `<text x="${f(X(v))}" y="${H - m.b + 16}" text-anchor="middle">${v}</text>`).join("")}
        <text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle">${xLabel}</text>
        <text x="${m.l - 6}" y="14" text-anchor="end">년</text>
        <line class="refl" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(10))}" y2="${f(Y(10))}"/><text x="${W - m.r}" y="${f(Y(10) - 5)}" text-anchor="end">10년</text>
        ${pts.map(p => `<line class="whisker" x1="${f(X(p.x))}" x2="${f(X(p.x))}" y1="${f(Y(p.c.lo))}" y2="${f(Y(p.c.hi))}"/>`).join("")}
        ${pts.map(p => `<circle class="dot" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="4.5"/>`).join("")}
        ${lab(minP)}${minP !== maxP ? lab(maxP) : ""}
        ${pts.map(p => `<circle class="hit" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="12" tabindex="0" ${tipAttr(p.s.name, [[xLabel, fmtX(p.x)], ["기본 비중 주기", yr(p.c.base)], ["범위", f(p.c.lo) + "–" + f(p.c.hi) + "년"], ["판정", JUDGE[p.c.j][0]]])}/>`).join("")}
      </svg></figure>`;
  }
  function labNav(cur) {
    return `<div class="labnav"><button class="linkbtn" ${goAttr({ name: "home" })}>‹ 관리 화면으로</button><div class="dirtabs" role="group" aria-label="분석 화면">${[["weather", "날씨 영향"], ["volume", "교체 물량"]].map(([k, l]) => `<button class="dirtab" aria-pressed="${k === cur}" ${goAttr({ name: k })}>${l}</button>`).join("")}</div></div>`;
  }
  let weatherCache = null;
  const SENS_VARS = [["rh", "습도", "+5%p"], ["temp", "기온", "+1°C"], ["dt", "일교차", "+1°C"]];
  function deltaTag(dy) {
    const m = Math.round(Math.abs(dy) * 12);
    return m ? `${monthsText(dy)} ${dy < 0 ? "빨라짐" : "늦어짐"}` : "영향 없음";
  }
  // 노선을 따라 역마다 한 부품의 교체주기: 10년(제조사 권장)에서 아래로 내려온 막대 끝이 그 역의 주기.
  // 바탕 띠는 같은 AWS 날씨 지점을 쓰는 역 묶음 — 같은 묶음은 날씨가 같아 주기도 같다
  function routeChart(ST, code) {
    const n = ST.length, CW = 40, L = 44, R = 14, T = 46, PH = 200, B = 44;
    const W = L + n * CW + R, H = T + PH + B;
    const vals = ST.map(s => s.cycles[code].base_years);
    const ylo = Math.max(0, Math.floor(Math.min(...vals) - 0.5)), yhi = 10.5;
    const Y = v => T + (yhi - v) / (yhi - ylo) * PH, X = i => L + i * CW + CW / 2, f = v => v.toFixed(1);
    const groups = [];
    ST.forEach((s, i) => { const g = groups[groups.length - 1]; if (g && g.obs === s.observatory) g.end = i; else groups.push({ obs: s.observatory, start: i, end: i, rh: s.weather.RH }); });
    const bands = groups.map((g, k) => {
      const x0 = L + g.start * CW, w = (g.end - g.start + 1) * CW, cx = x0 + w / 2;
      return `<rect class="${k % 2 ? "bandb" : "banda"}" x="${x0}" y="${T - 40}" width="${w}" height="${PH + 40}"/><text class="grp" x="${cx}" y="${T - 26}" text-anchor="middle">${esc(g.obs)}</text><text x="${cx}" y="${T - 12}" text-anchor="middle">${g.rh.toFixed(1)}%</text>`;
    }).join("");
    const ticks = niceTicks(ylo, 10, 4).map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${L - 6}" y="${f(Y(v) + 4)}" text-anchor="end">${v}년</text>`).join("");
    const iMin = vals.indexOf(Math.min(...vals)), iMax = vals.indexOf(Math.max(...vals));
    const marks = ST.map((s, i) => {
      const v = vals[i], x = X(i);
      const lab = i === iMin || i === iMax ? `<text class="v" x="${x}" y="${f(Y(v) + 18)}" text-anchor="middle">${yr(v)}</text>` : "";
      return `<line class="stem" x1="${x}" x2="${x}" y1="${f(Y(10))}" y2="${f(Y(v))}"/><circle class="dot" cx="${x}" cy="${f(Y(v))}" r="5"/>${lab}<text class="nm" x="${x}" y="${T + PH + (i % 2 ? 32 : 16)}" text-anchor="middle">${esc(s.name)}</text>`;
    }).join("");
    const hits = ST.map((s, i) => `<rect class="hit" x="${L + i * CW}" y="${T - 40}" width="${CW}" height="${PH + 40 + B}" tabindex="0" aria-label="${esc(s.name + " " + PART[code].name + " " + yr(vals[i]))}" ${tipAttr(s.name + " · " + PART[code].name, [["교체주기", yr(vals[i])], ["권장 10년보다", monthsText(10 - vals[i]) + " 짧음"], ["습도", s.weather.RH.toFixed(1) + "%"], ["기온", s.weather.T.toFixed(1) + "°C"], ["일교차", s.weather.DT.toFixed(1) + "°C"], ["날씨 지점", "AWS " + s.observatory]])}/>`).join("");
    return `<div class="scroll lolli"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc("역별 " + PART[code].name + " 교체주기")}">
        ${bands}${ticks}
        <line class="ten" x1="${L}" x2="${W - R}" y1="${f(Y(10))}" y2="${f(Y(10))}"/><text x="${W - R}" y="${f(Y(10) - 5)}" text-anchor="end">제조사 권장 10년</text>
        ${marks}${hits}
      </svg></div>`;
  }
  async function vWeather() {
    const [data, sens] = await Promise.all([api("/api/weather-impact"), api("/api/weather-impact/sensitivity")]);
    // 개통 전 역(북울산)은 PSD가 없어 교체주기를 말할 대상이 아니므로 뺀다
    weatherCache = { ...data, stations: data.stations.filter(s => s.in_service) };
    const ST = weatherCache.stations, REF = data.reference;
    const code = WPARTS.includes(view.wpart) ? view.wpart : "IFM";

    const maxAbs = Math.max(...WPARTS.flatMap(c => SENS_VARS.map(([k]) => Math.abs(sens.parts[c][k]))), 0.01);
    const cards = SENS_VARS.map(([k, name, step]) => `<div class="card"><h3>${name} ${step}</h3>
        ${WPARTS.map(c => { const d = sens.parts[c][k], zero = Math.round(Math.abs(d) * 12) === 0; return `<div class="srow ${zero ? "zero" : ""}"><span>${PART[c].name}</span><span class="strk"><span class="sb" style="width:${(Math.abs(d) / maxAbs * 100).toFixed(1)}%"></span></span><span class="sv">${deltaTag(d)}</span></div>`; }).join("")}
      </div>`).join("");

    const partSeg = `<div class="seg" role="group" aria-label="부품 고르기">${WPARTS.map(c => `<button class="segbtn" aria-pressed="${c === code}" ${goAttr({ ...view, wpart: c, keep: true })}>${PART[c].name}</button>`).join("")}</div>`;

    const rh = ST.map(s => s.weather.RH), dt = ST.map(s => s.weather.DT);
    const rhLo = Math.min(...rh) - 1, rhHi = Math.max(...rh) + 1, dtLo = Math.min(...dt) - 0.5, dtHi = Math.max(...dt) + 0.5;
    const all = ST.flatMap(s => WPARTS.map(k => cc(s.cycles[k])));
    const cyLo = Math.min(9.5, Math.floor(Math.min(...all.map(c => c.lo)) * 2) / 2), cyHi = Math.max(10.5, Math.ceil(Math.max(...all.map(c => c.hi)) * 2) / 2);
    const rows = ST.map(s => `<tr><td class="nm">${s.name}</td>
        <td>${dotCell(s.weather.RH, rhLo, rhHi, REF.RH, s.name, [["습도", s.weather.RH.toFixed(1) + "%"], ["24개 역 평균", REF.RH.toFixed(1) + "%"]], s.name + " 습도 " + s.weather.RH.toFixed(1) + "%")}</td>
        <td>${dotCell(s.weather.DT, dtLo, dtHi, REF.DT, s.name, [["일교차", s.weather.DT.toFixed(1) + "°C"], ["24개 역 평균", REF.DT.toFixed(1) + "°C"]], s.name + " 일교차 " + s.weather.DT.toFixed(1) + "°C")}</td>
        ${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td>${rangeCell(c, cyLo, cyHi, s.name + " · " + PART[k].name, [["기본 비중", yr(c.base)], ["범위", c.lo.toFixed(1) + "–" + c.hi.toFixed(1) + "년"], ["판정", JUDGE[c.j][0]]], s.name + " " + PART[k].name + " " + yr(c.base))}</td>`; }).join("")}</tr>`).join("");
    const numRows = ST.map(s => `<tr><td>${s.name}</td><td class="num">${s.weather.T.toFixed(1)}</td><td class="num">${s.weather.RH.toFixed(1)}</td><td class="num">${s.weather.DT.toFixed(1)}</td>${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td class="num">${c.base.toFixed(1)} (${c.lo.toFixed(1)}–${c.hi.toFixed(1)})</td>`; }).join("")}</tr>`).join("");

    return `<section class="view">
      ${labNav("weather")}
      <div class="panel">
        <h2>날씨가 한 칸 바뀌면 교체가 얼마나 빨라지나</h2>
        <div class="sens">${cards}</div>
      </div>
      <div class="panel">
        <div class="headrow"><h2>노선을 따라 본 교체주기</h2>${partSeg}</div>
        ${routeChart(ST, code)}
      </div>
      ${simPanel(view.simSt ?? ST[0].id)}
      <div class="panel">
        <details class="more"><summary>자세한 표와 그래프(원인 비중 범위 포함)</summary>
          <div class="scroll"><table class="rowchart">
            <tr><th>역</th><th>습도<span class="cap">${rhLo.toFixed(0)}–${rhHi.toFixed(0)}%</span></th><th>일교차<span class="cap">${dtLo.toFixed(1)}–${dtHi.toFixed(1)}°C</span></th>${WPARTS.map(k => `<th>${PART[k].name} 주기<span class="cap">${cyLo}–${cyHi}년</span></th>`).join("")}</tr>
            ${rows}
          </table></div>
          <button class="linkbtn" id="tbltoggle">숫자 표로 보기</button>
          <div class="scroll" id="numtbl" hidden><table><tr><th>역</th><th>기온 °C</th><th>습도 %</th><th>일교차 °C</th>${WPARTS.map(k => `<th>${PART[k].name} 주기(년)</th>`).join("")}</tr>${numRows}</table></div>
          <div class="charts2" style="margin-top:14px">
            ${scatter("습도와 IFM 릴레이 주기", ST, "RH", "평균 습도(%)", "IFM", v => v.toFixed(1) + "%")}
            ${scatter("일교차와 DCM 주기", ST, "DT", "평균 일교차(°C)", "DCM", v => v.toFixed(1) + "°C")}
          </div>
        </details>
      </div>
    </section>`;
  }
  function simPanel(stId) {
    return `<div class="panel" id="sim">
      <h2>이 역 날씨가 바뀌면</h2>
      <div class="filters"><select id="sim-st" aria-label="역">${weatherCache.stations.map(x => `<option value="${x.id}" ${x.id === stId ? "selected" : ""}>${x.id}. ${x.name}</option>`).join("")}</select></div>
      <div class="sliders">
        <div class="field"><label for="sim-rh">습도 변화 <b class="num" id="sim-rh-v">0%p</b></label><input type="range" id="sim-rh" min="-10" max="10" step="1" value="0"><span class="ends"><span>← 더 건조한 날씨</span><span>더 눅눅한 날씨 →</span></span></div>
        <div class="field"><label for="sim-dt">일교차 변화 <b class="num" id="sim-dt-v">0.0°C</b></label><input type="range" id="sim-dt" min="-3" max="3" step="0.5" value="0"><span class="ends"><span>← 낮밤 기온 차 작음</span><span>낮밤 기온 차 큼 →</span></span></div>
        <div class="field"><label for="sim-t">기온 변화 <b class="num" id="sim-t-v">0.0°C</b></label><input type="range" id="sim-t" min="-2" max="2" step="0.5" value="0"><span class="ends"><span>← 더 서늘한 날씨</span><span>더 더운 날씨 →</span></span></div>
      </div>
      <div id="sim-out"><p class="muted small">계산 중…</p></div>
    </div>`;
  }
  function setupSim() {
    const g = id => app.querySelector("#" + id);
    const sign = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
    let timer = null, seq = 0;
    const upd = () => {
      clearTimeout(timer);
      const dRH = Number(g("sim-rh").value), dDT = Number(g("sim-dt").value), dT = Number(g("sim-t").value);
      g("sim-rh-v").textContent = sign(dRH, 0) + "%p";
      g("sim-dt-v").textContent = sign(dDT, 1) + "°C";
      g("sim-t-v").textContent = sign(dT, 1) + "°C";
      timer = setTimeout(async () => {
        const my = ++seq;
        const s = weatherCache.stations.find(x => x.id === Number(g("sim-st").value));
        const sim = await api(`/api/weather-impact/simulate?station_id=${s.id}&d_temp=${dT}&d_rh=${dRH}&d_dt=${dDT}`);
        if (my !== seq || !g("sim-out")) return;  // 슬라이더를 빨리 움직이면 늦게 온 옛 응답이 새 결과를 덮지 않게
        const cards = WPARTS.map(k => {
          const a = sim.baseline[k].base_years, b = sim.cycles[k].base_years, d = b - a;
          return `<div class="card"><div class="headrow"><h3>${PART[k].name}</h3><span class="tag">${Math.round(Math.abs(d) * 12) ? "교체 " + deltaTag(d) : "변화 없음"}</span></div>
            ${cmpSvg([["지금 날씨", a, "b0"], ["바꾼 날씨", b, "b1"]], [[10, "권장 10년"]], `${s.name} ${PART[k].name} 지금 날씨와 바꾼 날씨 비교`)}</div>`;
        }).join("");
        const t = s.weather.T + dT, rh = Math.min(100, s.weather.RH + dRH), dt = Math.max(0.5, s.weather.DT + dDT);
        g("sim-out").innerHTML = `<div class="simgrid">${cards}</div>
          <p class="small muted">바꾼 날씨: 기온 ${t.toFixed(1)}°C · 습도 ${rh.toFixed(0)}% · 일교차 ${dt.toFixed(1)}°C</p>`;
      }, 150);
    };
    ["sim-st", "sim-rh", "sim-dt", "sim-t"].forEach(id => g(id).addEventListener("input", upd));
    upd();
  }

  // ---------- 교체 물량 ----------
  async function vVolume() {
    const vol = await api("/api/replacement-volume");
    const tot = q => PART_TYPES.reduce((a, p) => a + (q.counts[p.code] || 0), 0);
    const max = Math.max(...vol.quarters.map(tot), 1);
    const checkTot = PART_TYPES.reduce((a, p) => a + (vol.check.counts[p.code] || 0), 0);
    return `<section class="view">
      ${labNav("volume")}
      <div class="panel">
        <h2>기간별 교체 물량</h2>
        <div class="scroll"><table class="vol">
          <tr><th>분기</th>${PART_TYPES.map(p => `<th>${p.name}</th>`).join("")}<th>합계</th><th></th></tr>
          <tr class="checkrow"><td>확인 필요</td>${PART_TYPES.map(p => `<td class="n">${vol.check.counts[p.code] || ""}</td>`).join("")}<td class="n">${checkTot}</td><td></td></tr>
          ${vol.quarters.map(q => `<tr><td>${q.label}</td>${PART_TYPES.map(p => `<td class="n">${q.counts[p.code] || ""}</td>`).join("")}<td class="n"><b>${q.total.toLocaleString()}</b></td><td class="barcell"><div class="vbar" style="width:${(tot(q) / max * 100).toFixed(1)}%"></div></td></tr>`).join("")}
        </table></div>
      </div>
    </section>`;
  }

  view = decodeHash();
  if (!location.hash) { suppressHash = true; location.hash = encodeView(view); }
  render();
})();
</script>
