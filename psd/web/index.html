<style>

  --amber-soft: #fbf1dc;

  --gray: #7d8796;
  --gray-soft: #eceff3;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151d; --surface: #17202b; --ink: #e5ebf2; --muted: #9aa7b7; --line: #2a3644;
    --rail: #4d76a6; --accent: #7fb0f0; --accent-soft: #1d2b3c;
    --red: #f0705c; --red-soft: #3a211d; --amber: #eeb54a; --amber-soft: #3a2f18;

  }
}
:root[data-theme="dark"] {
  --bg: #0f151d; --surface: #17202b; --ink: #e5ebf2; --muted: #9aa7b7; --line: #2a3644;
  --rail: #4d76a6; --accent: #7fb0f0; --accent-soft: #1d2b3c;
  --red: #f0705c; --red-soft: #3a211d; --amber: #eeb54a; --amber-soft: #3a2f18;

<script>
(function () {
  "use strict";

  // ---------- API ----------
  async function api(path) {
    const r = await fetch(path);
    if (!r.ok) throw new Error((await r.text()) || (path + " 실패"));
    return r.json();
  }
  async function apiPost(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Array.isArray(data.detail) ? data.detail.map(d => d.msg).join(", ") : (data.detail || (path + " 실패")));
    return data;
  }

  // 부품 종류: 화면 표시용 고정 목록(이름·단위). 값은 아니라 한 번만 받아 둔다
  let PART_TYPES = [], PART = {}, DOOR_PART_CODES = [], STATION_PART_CODES = [];
  async function loadPartTypes() {
    if (PART_TYPES.length) return;
    const { part_types } = await api("/api/part-types");
    PART_TYPES = part_types;
    PART = Object.fromEntries(PART_TYPES.map(p => [p.code, p]));
    DOOR_PART_CODES = PART_TYPES.filter(p => p.unit === "door").map(p => p.code);
    STATION_PART_CODES = PART_TYPES.filter(p => p.unit === "station").map(p => p.code);
  }

  const REASONS = { fail: "고장", prev: "예방 교체", with: "함께 교체" };
  const STATE = { 빨강: ["빨강", "s-red"], 노랑: ["노랑", "s-amber"], 초록: ["초록", "s-green"], 확인_필요: ["확인 필요", "s-check"] };
  const RANK = { 빨강: 0, 확인_필요: 1, 노랑: 2, 초록: 3 };
  const JUDGE = {
    같음: ["10년과 같음", "s-check", "비중을 어떻게 잡아도 10년과 0.5년 이내로 차이 납니다."],
    짧음_확실: ["짧음 확실", "s-red", "원인 비중을 어떻게 잡아도 10년보다 짧습니다."],
    김_확실: ["김 확실", "s-green", "원인 비중을 어떻게 잡아도 10년보다 깁니다. 10년보다 늦은 교체는 권고하지 않고 참고로만 보여 줍니다."],
    불확실: ["불확실", "s-amber", "원인 비중에 따라 10년보다 짧게도, 길게도 나옵니다."],
    날씨무관: ["날씨 보정 없음", "s-check", "날씨가 수명을 줄인다는 정량 근거를 찾지 못해 제조사 권장 10년을 씁니다."]
  };
  const SRC = {
    DCM: [["Nichicon 콘덴서 수명 계산기", "https://www.nichicon.com/en-us/design-support/lifetime-calculator/"], ["Norris-Landzberg 납땜 피로", "https://accendoreliability.com/norris-landzberg-solder-joint-fatigue/"], ["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    IFM: [["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    MOTOR: [["NSWC-98 식 14-4 권선 온도 계수", "https://everyspec.com/USN/NSWC/NSWC-98_RELIABILITY_HDBK_SEP1998_55321/"]]
  };

  // ---------- 유틸 ----------
  function fmtDateKR(s) { const [y, m, d] = s.split("-").map(Number); return `${y}년 ${m}월 ${d}일`; }
  function openLabel(station) { return station.id === 24 ? "2026년 9월(일자 미정)" : fmtDateKR(station.open_date); }
  function yr(x) { return x.toFixed(1) + "년"; }
  function dur(days) {
    const a = Math.abs(days), m = Math.round(a / 30.44);
    const t = m >= 12 ? Math.floor(m / 12) + "년" + (m % 12 ? " " + (m % 12) + "개월" : "") : (m ? m + "개월" : a + "일");
    return days < 0 ? t + " 지남" : t + " 남음";
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function pill(status) { return `<span class="pill ${STATE[status][1]}">${STATE[status][0]}</span>`; }
  function jpill(j) { return `<span class="pill ${JUDGE[j][1]}">${JUDGE[j][0]}</span>`; }
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2400); }
  function worstDoor(doors) { return doors.reduce((a, d) => (RANK[d.worst_status] < RANK[a.worst_status] || (RANK[d.worst_status] === RANK[a.worst_status] && d.worst_days_left < a.worst_days_left)) ? d : a); }

  // ---------- 화면 ----------
  const app = document.getElementById("app");
  let view = { name: "route" };
  function go(v) { const keep = v.keep; view = v; render(); if (!keep) window.scrollTo(0, 0); }
  document.getElementById("tab-route").onclick = () => go({ name: "route" });
  document.getElementById("tab-volume").onclick = () => go({ name: "volume" });
  document.getElementById("tab-weather").onclick = () => go({ name: "weather" });

  async function render() {
    const tab = view.name === "volume" ? "volume" : view.name === "weather" ? "weather" : "route";
    ["route", "weather", "volume"].forEach(t => document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === tab)));
    app.innerHTML = `<p class="muted" style="padding-top:18px">불러오는 중…</p>`;
    try {
      await loadPartTypes();
      const html = await ({ route: vRoute, station: vStation, part: vPart, form: vForm, volume: vVolume, weather: vWeather }[view.name])();
      app.innerHTML = html;
      bind();
    } catch (e) {
      app.innerHTML = `<section class="view"><div class="panel"><h2>불러오지 못했습니다</h2><p class="small muted">${esc(e.message || String(e))}</p><button class="btn" id="retry">다시 시도</button></div></section>`;
      app.querySelector("#retry").addEventListener("click", render);
    }
  }

  const tipEl = document.getElementById("tip");
  function showTip(el) {
    const d = JSON.parse(el.dataset.tip);
    tipEl.replaceChildren();
    const t = document.createElement("b"); t.textContent = d.t; tipEl.append(t);
    d.r.forEach(([k, v]) => { const row = document.createElement("div"), vv = document.createElement("strong"), kk = document.createElement("span"); vv.textContent = v; kk.textContent = " " + k; row.append(vv, kk); tipEl.append(row); });
    tipEl.hidden = false;
  }
  function placeTip(x, y) {
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x + 14)) + "px";
    tipEl.style.top = Math.max(8, y - h - 12) + "px";
  }
  app.addEventListener("pointermove", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tipEl.hidden = true; return; } showTip(el); placeTip(e.clientX, e.clientY); });
  app.addEventListener("pointerleave", () => { tipEl.hidden = true; });
  app.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) return; showTip(el); const r = el.getBoundingClientRect(); placeTip(r.left + r.width / 2, r.top); });
  app.addEventListener("focusout", () => { tipEl.hidden = true; });
  const tipAttr = (t, r) => `data-tip="${esc(JSON.stringify({ t, r }))}"`;

  function bind() {
    app.querySelectorAll("[data-go]").forEach(el => {
      el.addEventListener("click", () => go(JSON.parse(el.dataset.go)));
      if (el.tagName !== "BUTTON") el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(JSON.parse(el.dataset.go)); } });
    });
    const jump = app.querySelector("#st-jump");
    if (jump) jump.addEventListener("change", () => go({ name: "station", st: Number(jump.value) }));
    const tt = app.querySelector("#tbltoggle");
    if (tt) tt.addEventListener("click", () => { const t = app.querySelector("#numtbl"); t.hidden = !t.hidden; tt.textContent = t.hidden ? "숫자 표로 보기" : "숫자 표 닫기"; });
    if (app.querySelector("#sim")) setupSim();
    const f = app.querySelector("#recform");
    if (f) setupForm(f);
  }
  const goAttr = v => `data-go='${JSON.stringify(v)}'`;
  const legend = `<div class="legend">${pill("빨강")}<span class="muted">6개월 이하(지난 경우 포함)</span>${pill("노랑")}<span class="muted">1년 이하</span>${pill("확인_필요")}<span class="muted">기록 없이 예정일 지남</span>${pill("초록")}<span class="muted">그 외</span></div>`;

  // ---------- 노선 ----------

      return `<li><button class="st" ${goAttr({ name: "station", st: s.id })}><span class="body"><span class="name">${s.name}</span><span class="meta">${openLabel(s)} 개통 · 관측소 ${s.observatory === "159" ? "부산" : "울산"}(추정)</span></span><span class="badges">${b || '<span class="pill s-green">경고 없음</span>'}</span><span class="chev" aria-hidden="true">›</span></button></li>`;
    };
    return `<section class="view">
      <div class="stats">
        <div class="stat red"><span class="small muted">빨강</span><b>${data.totals.빨강.toLocaleString()}</b><span class="small muted">6개월 안에 교체</span></div>
        <div class="stat check"><span class="small muted">확인 필요</span><b>${data.totals.확인_필요.toLocaleString()}</b><span class="small muted">기록 없이 예정일 지남</span></div>
        <div class="stat amber"><span class="small muted">노랑</span><b>${data.totals.노랑.toLocaleString()}</b><span class="small muted">1년 안에 교체</span></div>
      </div>
      ${legend}
      <ul class="route">${data.stations.map(item).join("")}</ul>
      <p class="note">부전–일광 구간은 2016-12-30 개통이라 기록이 없는 부품이 2026-12-30에 10년이 됩니다. 그래서 이 구간에 빨강·확인 필요가 많습니다.</p>
    </section>`;
  }

  // ---------- 역 ----------
  const SIDE_LABEL = { U: "부전 방면", D: "북울산 방면" };
  async function vStation() {
    const st = view.st;
    const [detail, list] = await Promise.all([api(`/api/stations/${st}`), api("/api/stations")]);
    const sid = view.side || "U";
    const sideDoors = detail.sides[sid].doors;
    const doorId = sideDoors.find(d => d.id === view.door) ? view.door : worstDoor(sideDoors).id;
    const doorDetail = await api(`/api/doors/${doorId}`);
    const door = doorDetail.door;

    const at = (d, keep) => ({ name: "station", st, side: sid, door: d, keep });
    const dirTabs = `<div class="dirtabs" role="group" aria-label="방향 선택">${Object.entries(SIDE_LABEL).map(([k, v]) => `<button class="dirtab" aria-pressed="${k === sid}" ${goAttr({ name: "station", st, side: k, keep: true })}>${v}</button>`).join("")}</div>`;
    const strip = `<div class="strip-wrap"><div class="strip">${[1, 2, 3, 4].map(car => `<div class="car"><div class="carlabel">${car}호차</div><div class="cardoors">${sideDoors.filter(d => d.car === car).map(d =>
      `<button class="psd c-${d.worst_status}" aria-pressed="${d.id === doorId}" aria-label="${esc(d.no + " · " + STATE[d.worst_status][0])}" ${goAttr(at(d.id, true))}><span class="psd-head"></span><span class="psd-glass"><i></i><i></i></span><span class="psd-no">${d.no}</span></button>`

    const u = code => doorDetail.units.find(x => x.part_type_code === code);
    const chip = (code, label, x, y, w) => { const x0 = u(code); return `<g class="chip c-${x0.status}" tabindex="0" role="link" aria-label="${esc(x0.part_name + " " + STATE[x0.status][0])}" ${goAttr({ name: "part", partId: x0.part_id })}><rect x="${x}" y="${y}" width="${w}" height="24" rx="5"/><text x="${x + w / 2}" y="${y + 16}" text-anchor="middle">${label}</text></g>`; };

        <rect class="rail" x="16" y="76" width="328" height="4" rx="2"/>
        ${chip("HANGER", "행거", 148, 84, 64)}
        <rect class="fixed" x="16" y="112" width="72" height="122"/>
        <rect class="leaf" x="90" y="112" width="89" height="122"/>
        <rect class="leaf" x="181" y="112" width="89" height="122"/>
        <rect class="fixed" x="272" y="112" width="72" height="122"/>
        <line class="stripe" x1="96" x2="173" y1="168" y2="168"/><line class="stripe" x1="187" x2="264" y1="168" y2="168"/>
        <line class="floor" x1="8" x2="352" y1="238" y2="238"/>

    const partRows = order.map(x => `<tr class="prow" tabindex="0" ${goAttr({ name: "part", partId: x.part_id })}><td><b>${x.part_name}</b></td><td>${pill(x.status)}</td><td class="num">${yr(x.cycle.base_years)}</td><td class="num">${x.due}</td><td class="num">${dur(x.days_left)}</td></tr>`).join("");

    const psc = detail.psc, s = detail.station, c = detail.counts;
    return `<section class="view">
      <nav class="crumbs"><button ${goAttr({ name: "route" })}>노선</button><span>›</span><span>${s.name}</span></nav>
      ${switcher}
      <div class="panel">

        <div class="legend">${pill("빨강")} ${c.빨강} ${pill("확인_필요")} ${c.확인_필요} ${pill("노랑")} ${c.노랑} ${pill("초록")} ${c.초록}</div>

        <div class="legend">${pill("빨강")}<span class="muted">6개월 이하</span>${pill("확인_필요")}<span class="muted">기록 없이 지남</span>${pill("노랑")}<span class="muted">1년 이하</span>${pill("초록")}<span class="muted">여유</span></div>

      </div>
    </section>`;
  }

  // ---------- 부품 상세 ----------
  async function vPart() {
    const p = await api(`/api/parts/${view.partId}`);
    const { part, cycle, due, days_left, status, weather_basis, history } = p;
    const lo = 7, hi = 13, pos = x => ((Math.min(Math.max(x, lo), hi) - lo) / (hi - lo) * 100).toFixed(2) + "%";
    const range = cycle.judgment === "날씨무관" ? "" : `
      <div class="rangebar" aria-hidden="true"><div class="track"></div><div class="band" style="left:${pos(cycle.lo_years)};width:calc(${pos(cycle.hi_years)} - ${pos(cycle.lo_years)})"></div><div class="tick" style="left:${pos(10)}"></div><div class="base" style="left:${pos(cycle.base_years)}"></div></div>
      <div class="rangeaxis"><span>7년</span><span>10년</span><span>13년</span></div>
      <p class="small muted">점: 기본 비중 결과 · 띠: 원인 비중을 바꿨을 때의 범위 ${yr(cycle.lo_years)}–${yr(cycle.hi_years)} · 세로선: 제조사 권장 10년</p>`;

    let basis;
    if (!weather_basis) {
      basis = `<p>${JUDGE.날씨무관[2]}${part.part_type_code === "PSC" ? " 종합제어반은 실내 설비입니다." : ""}</p>
        ${part.part_type_code === "HANGER" || part.part_type_code === "PULLEY" ? `<p class="small muted">참고 지표(다음 단계에서 표시): 결빙일 수, 습윤 시간(습도 80% 초과이면서 0°C 초과인 시간)</p>` : ""}
        <ol class="src"><li>NSWC-98 기계부품 신뢰성 핸드북: 벨트 장 없음, 베어링 계수에 날씨 입력 없음 — <a href="https://everyspec.com/USN/NSWC/NSWC-98_RELIABILITY_HDBK_SEP1998_55321/" target="_blank" rel="noopener">EverySpec</a></li></ol>`;
    } else {
      const wb = weather_basis, src = SRC[part.part_type_code] || [];
      basis = `<div class="scroll"><table><tr><th></th><th>이 역(${wb.observatory})</th><th>24개 역 평균</th></tr>
          <tr><td>연평균 기온</td><td class="num">${wb.station_climate.T.toFixed(1)}°C</td><td class="num">${wb.reference_climate.T.toFixed(1)}°C</td></tr>
          <tr><td>평균 습도</td><td class="num">${wb.station_climate.RH.toFixed(1)}%</td><td class="num">${wb.reference_climate.RH.toFixed(1)}%</td></tr>
          <tr><td>평균 일교차</td><td class="num">${wb.station_climate.DT.toFixed(1)}°C</td><td class="num">${wb.reference_climate.DT.toFixed(1)}°C</td></tr></table></div>
        <div class="scroll"><table><tr><th>고장 원인</th><th>날씨 변수</th><th>열화 속도(평균 대비)</th><th>비중 기본값(범위)</th></tr>
          ${wb.causes.map(r => `<tr><td>${r.name}</td><td>${r.variable}</td><td class="num">${r.af.toFixed(2)}배</td><td class="num">${r.weight_default}</td></tr>`).join("")}</table></div>
        <p class="small muted">권장 주기 = 10년 ÷ (원인별 열화 속도 × 비중의 합). 기상청 10년치(${wb.weather_period.start}~${wb.weather_period.end}) 일자료로 계산.</p>
        <button class="linkbtn" ${goAttr({ name: "weather", simSt: part.station_id })}>이 역 날씨를 바꿔 보기 ›</button>
        <ol class="src">${src.map(x => `<li><a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a></li>`).join("")}</ol>`;
    }
    const hist = history.length ? `<div class="list">${history.map(r => `<div class="row" style="cursor:default"><span class="pill s-check">${REASONS[r.reason]}</span><span class="what">${r.replaced_on}</span><span class="small muted">입력한 기록</span></div>`).join("")}</div>` : `<p class="muted">교체 기록이 없습니다. 역 개통일을 설치일로 봅니다.</p>`;
    return `<section class="view">
      <nav class="crumbs"><button ${goAttr({ name: "route" })}>노선</button><span>›</span><button ${goAttr({ name: "station", st: part.station_id })}>${part.station_name}</button><span>›</span><span>${part.door_label} ${part.part_name}</span></nav>
      <div class="panel">
        <h2>${part.station_name} · ${part.door_label} · ${part.part_name}</h2>
        <div class="legend">${pill(status)} <span class="num">${dur(days_left)}</span></div>
        <dl class="kv"><dt>다음 교체 예정일</dt><dd class="num">${due}</dd></dl>
        ${status === "확인_필요" ? `<p class="small">교체 기록이 없는데 예정일이 지났습니다. 이미 교체했다면 기록을 입력해 주세요. 교체하지 않았다면 교체 대상입니다.</p>` : ""}
        <button class="btn" ${goAttr({ name: "form", st: part.station_id, door: part.door_id, code: part.part_type_code })}>교체 기록 입력</button>
      </div>
      <div class="panel">
        <h3>이 역의 권장 주기</h3>
        <div class="cycle"><span class="big">${yr(cycle.base_years)}</span>${jpill(cycle.judgment)}</div>
        <p class="small">${JUDGE[cycle.judgment][2]}</p>
        ${range}
      </div>
      <div class="panel"><h3>근거</h3>${basis}</div>
      <div class="panel"><h3>교체 이력</h3>${hist}</div>
    </section>`;
  }

  // ---------- 교체 기록 입력 ----------
  async function vForm() {
    const detail = await api(`/api/stations/${view.st}`);
    const doors = [...detail.sides.U.doors, ...detail.sides.D.doors];
    const doorOpts = `<option value="">위치를 고르세요</option><option value="PSC" ${view.door == null && view.code === "PSC" ? "selected" : ""}>역 공통(종합제어반)</option>` +
      doors.map(d => `<option value="${d.id}" ${view.door === d.id ? "selected" : ""}>${SIDE_LABEL[detail.sides.U.doors.includes(d) ? "U" : "D"]} ${d.no}</option>`).join("");
    return `<section class="view">
      <nav class="crumbs"><button ${goAttr({ name: "route" })}>노선</button><span>›</span><button ${goAttr({ name: "station", st: view.st })}>${detail.station.name}</button><span>›</span><span>교체 기록 입력</span></nav>
      <form class="panel form" id="recform" novalidate data-st="${view.st}">
        <h2>${detail.station.name} 교체 기록 입력</h2>
        <div class="field"><label for="f-date">교체일</label><input type="date" id="f-date" value="${new Date().toISOString().slice(0, 10)}" max="${new Date().toISOString().slice(0, 10)}"></div>
        <div class="field"><label for="f-door">위치</label><select id="f-door">${doorOpts}</select></div>
        <fieldset class="field"><legend>교체한 부품 (여러 개 선택)</legend><div class="checks" id="f-parts"></div></fieldset>
        <fieldset class="field"><legend>교체 사유</legend><div class="checks">
          ${Object.entries(REASONS).map(([k, v], n) => `<label><input type="radio" name="reason" id="f-r-${k}" value="${k}" ${n === 0 ? "checked" : ""}> ${v}</label>`).join("")}
        </div></fieldset>
        <p class="err" id="f-err" hidden></p>
        <button class="btn" type="submit">저장</button>
      </form>
    </section>`;
  }
  function setupForm(f) {
    const st = Number(f.dataset.st);
    const door = f.querySelector("#f-door"), box = f.querySelector("#f-parts"), err = f.querySelector("#f-err");
    const fill = () => {
      const list = door.value === "PSC" ? STATION_PART_CODES : door.value ? DOOR_PART_CODES : [];
      box.innerHTML = list.length ? list.map(code => `<label><input type="checkbox" id="f-p-${code}" value="${code}" ${code === view.code ? "checked" : ""}> ${PART[code].name}</label>`).join("") : `<span class="small muted">위치를 먼저 고르세요.</span>`;
    };
    door.addEventListener("change", fill); fill();
    f.addEventListener("submit", async e => {
      e.preventDefault();
      const d = f.querySelector("#f-date").value, parts = [...box.querySelectorAll("input:checked")].map(x => x.value);
      const msg = !d ? "교체일을 입력하세요." : !door.value ? "위치를 고르세요." : !parts.length ? "교체한 부품을 하나 이상 고르세요." : "";
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      const doorId = door.value === "PSC" ? null : Number(door.value);
      try {
        const result = await apiPost("/api/replacement-records", {
          station_id: st, door_id: doorId, replaced_on: d,
          reason: f.querySelector("input[name=reason]:checked").value, part_type_codes: parts
        });
        toast("저장했습니다. 다음 예정일을 다시 계산했습니다.");
        go({ name: "part", partId: result.updated_parts[0].part_id });
      } catch (ex) {
        err.textContent = ex.message; err.hidden = false;
      }
    });
  }

  // ---------- 날씨 영향 ----------
  const WPARTS = ["DCM", "IFM", "MOTOR"];
  function niceTicks(lo, hi, n) {
    const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
    const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= n) || mag * 10;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function dotCell(v, lo, hi, ref, tipT, tipR, label) {
    const W = 120, H = 22, x = t => (6 + (t - lo) / (hi - lo) * (W - 12)).toFixed(1);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><line class="refl" x1="${x(ref)}" x2="${x(ref)}" y1="3" y2="19"/><circle class="dot" cx="${x(v)}" cy="11" r="4.5"/></svg>`;
  }
  function rangeCell(c, lo, hi, tipT, tipR, label) {
    const W = 120, H = 22, x = t => 6 + (t - lo) / (hi - lo) * (W - 12);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><rect class="band" x="${x(c.lo).toFixed(1)}" y="8" width="${Math.max(2, x(c.hi) - x(c.lo)).toFixed(1)}" height="6" rx="3"/><line class="refl" x1="${x(10).toFixed(1)}" x2="${x(10).toFixed(1)}" y1="3" y2="19"/><circle class="dot" cx="${x(c.base).toFixed(1)}" cy="11" r="4.5"/></svg>`;
  }
  function cc(cyc) { return { base: cyc.base_years, lo: cyc.lo_years, hi: cyc.hi_years, j: cyc.judgment }; }
  function scatter(title, stations, key, xLabel, code, fmtX) {
    const W = 440, H = 280, m = { l: 44, r: 16, t: 26, b: 44 };
    const pts = stations.map(s => ({ s, x: s.weather[key], c: cc(s.cycles[code]) }));
    const xs = pts.map(p => p.x), pad = (Math.max(...xs) - Math.min(...xs)) * 0.08 || 1;
    const xlo = Math.min(...xs) - pad, xhi = Math.max(...xs) + pad;
    const ylo = Math.min(9.5, Math.floor(Math.min(...pts.map(p => p.c.lo)) * 2) / 2), yhi = Math.max(10.5, Math.ceil(Math.max(...pts.map(p => p.c.hi)) * 2) / 2);
    const X = v => m.l + (v - xlo) / (xhi - xlo) * (W - m.l - m.r), Y = v => H - m.b - (v - ylo) / (yhi - ylo) * (H - m.t - m.b);
    const f = v => v.toFixed(1);
    const minP = pts.reduce((a, b) => b.c.base < a.c.base ? b : a), maxP = pts.reduce((a, b) => b.c.base > a.c.base ? b : a);
    const lab = p => { const x = X(p.x), right = x > W / 2; return `<text class="lab" x="${f(right ? x - 9 : x + 9)}" y="${f(Y(p.c.base) - 7)}" text-anchor="${right ? "end" : "start"}">${esc(p.s.name)}</text>`; };
    return `<figure><figcaption>${title}</figcaption>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
        ${niceTicks(ylo, yhi, 5).map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${m.l - 6}" y="${f(Y(v) + 4)}" text-anchor="end">${v}</text>`).join("")}
        ${niceTicks(xlo, xhi, 5).map(v => `<text x="${f(X(v))}" y="${H - m.b + 16}" text-anchor="middle">${v}</text>`).join("")}
        <text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle">${xLabel}</text>
        <text x="${m.l - 6}" y="14" text-anchor="end">년</text>
        <line class="refl" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(10))}" y2="${f(Y(10))}"/><text x="${W - m.r}" y="${f(Y(10) - 5)}" text-anchor="end">10년</text>
        ${pts.map(p => `<line class="whisker" x1="${f(X(p.x))}" x2="${f(X(p.x))}" y1="${f(Y(p.c.lo))}" y2="${f(Y(p.c.hi))}"/>`).join("")}
        ${pts.map(p => `<circle class="dot" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="4.5"/>`).join("")}
        ${lab(minP)}${minP !== maxP ? lab(maxP) : ""}
        ${pts.map(p => `<circle class="hit" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="12" tabindex="0" ${tipAttr(p.s.name, [[xLabel, fmtX(p.x)], ["기본 비중 주기", yr(p.c.base)], ["범위", f(p.c.lo) + "–" + f(p.c.hi) + "년"], ["판정", JUDGE[p.c.j][0]]])}/>`).join("")}
      </svg></figure>`;
  }
  let weatherCache = null;
  async function vWeather() {
    const data = await api("/api/weather-impact");
    weatherCache = data;
    const ST = data.stations, REF = data.reference;
    const rh = ST.map(s => s.weather.RH), dt = ST.map(s => s.weather.DT);
    const rhLo = Math.min(...rh) - 1, rhHi = Math.max(...rh) + 1, dtLo = Math.min(...dt) - 0.5, dtHi = Math.max(...dt) + 0.5;
    const all = ST.flatMap(s => WPARTS.map(k => cc(s.cycles[k])));
    const cyLo = Math.min(9.5, Math.floor(Math.min(...all.map(c => c.lo)) * 2) / 2), cyHi = Math.max(10.5, Math.ceil(Math.max(...all.map(c => c.hi)) * 2) / 2);
    const rows = ST.map(s => `<tr><td class="nm">${s.name}</td>
        <td>${dotCell(s.weather.RH, rhLo, rhHi, REF.RH, s.name, [["습도", s.weather.RH.toFixed(1) + "%"], ["24개 역 평균", REF.RH.toFixed(1) + "%"]], s.name + " 습도 " + s.weather.RH.toFixed(1) + "%")}</td>
        <td>${dotCell(s.weather.DT, dtLo, dtHi, REF.DT, s.name, [["일교차", s.weather.DT.toFixed(1) + "°C"], ["24개 역 평균", REF.DT.toFixed(1) + "°C"]], s.name + " 일교차 " + s.weather.DT.toFixed(1) + "°C")}</td>
        ${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td>${rangeCell(c, cyLo, cyHi, s.name + " · " + PART[k].name, [["기본 비중", yr(c.base)], ["범위", c.lo.toFixed(1) + "–" + c.hi.toFixed(1) + "년"], ["판정", JUDGE[c.j][0]]], s.name + " " + PART[k].name + " " + yr(c.base))}</td>`; }).join("")}</tr>`).join("");
    const numRows = ST.map(s => `<tr><td>${s.name}</td><td class="num">${s.weather.T.toFixed(1)}</td><td class="num">${s.weather.RH.toFixed(1)}</td><td class="num">${s.weather.DT.toFixed(1)}</td>${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td class="num">${c.base.toFixed(1)} (${c.lo.toFixed(1)}–${c.hi.toFixed(1)})</td>`; }).join("")}</tr>`).join("");
    return `<section class="view">
      <div class="panel">
        <h2>노선을 따라 본 날씨와 교체주기</h2>
        <p class="small muted">왼쪽 두 칸은 역의 날씨(세로선 = 24개 역 평균), 오른쪽 세 칸은 그 날씨로 계산한 권장 주기입니다(점 = 기본 비중, 띠 = 원인 비중을 바꿨을 때의 범위, 세로선 = 10년). 점이나 띠에 마우스를 올리면 값이 나옵니다.</p>
        <div class="scroll"><table class="rowchart">
          <tr><th>역</th><th>습도<span class="cap">${rhLo.toFixed(0)}–${rhHi.toFixed(0)}%</span></th><th>일교차<span class="cap">${dtLo.toFixed(1)}–${dtHi.toFixed(1)}°C</span></th>${WPARTS.map(k => `<th>${PART[k].name} 주기<span class="cap">${cyLo}–${cyHi}년</span></th>`).join("")}</tr>
          ${rows}
        </table></div>
        <button class="linkbtn" id="tbltoggle">숫자 표로 보기</button>
        <div class="scroll" id="numtbl" hidden><table><tr><th>역</th><th>기온 °C</th><th>습도 %</th><th>일교차 °C</th>${WPARTS.map(k => `<th>${PART[k].name} 주기(년)</th>`).join("")}</tr>${numRows}</table></div>
      </div>
      <div class="panel">
        <h2>날씨와 주기의 관계</h2>
        <p class="small muted">점 하나가 역 하나입니다. 세로 막대는 원인 비중을 바꿨을 때의 범위입니다.</p>
        <div class="charts2">
          ${scatter("습도와 IFM 릴레이 주기", ST, "RH", "평균 습도(%)", "IFM", v => v.toFixed(1) + "%")}
          ${scatter("일교차와 DCM 주기", ST, "DT", "평균 일교차(°C)", "DCM", v => v.toFixed(1) + "°C")}
        </div>
        <p class="note">IFM 릴레이는 원인이 습도 하나라 점들이 두 묶음(부산·울산 관측소)으로만 나뉩니다. DCM은 기온·일교차·습도가 함께 작용합니다. 역별 실제 관측소(AWS)가 연결되면 묶음이 24개 역으로 퍼집니다.</p>
      </div>
      ${simPanel(view.simSt ?? ST[0].id)}
    </section>`;
  }
  function simPanel(stId) {
    return `<div class="panel" id="sim">
      <h2>날씨가 바뀌면</h2>
      <p class="small muted">한 역의 날씨를 바꿨을 때 권장 주기가 어떻게 달라지는지 API로 다시 계산합니다. 비교 기준(24개 역 평균)은 그대로 둡니다.</p>
      <div class="field"><label for="sim-st">역</label><select id="sim-st">${weatherCache.stations.map(x => `<option value="${x.id}" ${x.id === stId ? "selected" : ""}>${x.id}. ${x.name}</option>`).join("")}</select></div>
      <div class="sliders">
        <div class="field"><label for="sim-rh">습도 변화 <b class="num" id="sim-rh-v">0%p</b></label><input type="range" id="sim-rh" min="-10" max="10" step="1" value="0"></div>
        <div class="field"><label for="sim-dt">일교차 변화 <b class="num" id="sim-dt-v">0.0°C</b></label><input type="range" id="sim-dt" min="-3" max="3" step="0.5" value="0"></div>
        <div class="field"><label for="sim-t">기온 변화 <b class="num" id="sim-t-v">0.0°C</b></label><input type="range" id="sim-t" min="-2" max="2" step="0.5" value="0"></div>
      </div>
      <div id="sim-out"><p class="muted small">계산 중…</p></div>
      <button class="linkbtn" id="sim-reset">변화 없음으로 되돌리기</button>
    </div>`;
  }
  function setupSim() {
    const g = id => app.querySelector("#" + id);
    const sign = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
    let timer = null;
    const upd = () => {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        const s = weatherCache.stations.find(x => x.id === Number(g("sim-st").value));
        const dRH = Number(g("sim-rh").value), dDT = Number(g("sim-dt").value), dT = Number(g("sim-t").value);
        g("sim-rh-v").textContent = sign(dRH, 0) + "%p";
        g("sim-dt-v").textContent = sign(dDT, 1) + "°C";
        g("sim-t-v").textContent = sign(dT, 1) + "°C";
        const sim = await api(`/api/weather-impact/simulate?station_id=${s.id}&d_temp=${dT}&d_rh=${dRH}&d_dt=${dDT}`);
        const rows = WPARTS.map(k => {
          const a = cc(s.cycles[k]), b = cc(sim.cycles[k]), d = b.base - a.base;
          const cls = Math.abs(d) < 0.05 ? "muted" : d > 0 ? "delta-up" : "delta-down";
          return `<tr><td>${PART[k].name}</td><td class="num">${yr(a.base)} <span class="muted small">(${a.lo.toFixed(1)}–${a.hi.toFixed(1)})</span></td><td class="num">${yr(b.base)} <span class="muted small">(${b.lo.toFixed(1)}–${b.hi.toFixed(1)})</span></td><td class="num ${cls}">${sign(d, 1)}년</td><td>${jpill(b.j)}</td></tr>`;
        }).join("");
        const t = s.weather.T + dT, rh = Math.min(100, s.weather.RH + dRH), dt = Math.max(0.5, s.weather.DT + dDT);
        g("sim-out").innerHTML = `<div class="scroll"><table><tr><th>부품</th><th>지금 날씨</th><th>바꾼 날씨</th><th>차이</th><th>바꾼 날씨 판정</th></tr>${rows}</table></div>
          <p class="small muted">바꾼 날씨(10년 전체를 이 만큼 옮겨서 다시 계산): 기온 ${t.toFixed(1)}°C, 습도 ${rh.toFixed(0)}%, 일교차 ${dt.toFixed(1)}°C. 타이밍벨트·풀리·도어 행거·종합제어반 릴레이는 날씨와 상관없이 10년입니다.</p>`;
      }, 150);
    };
    ["sim-st", "sim-rh", "sim-dt", "sim-t"].forEach(id => g(id).addEventListener("input", upd));
    g("sim-reset").addEventListener("click", () => { g("sim-rh").value = 0; g("sim-dt").value = 0; g("sim-t").value = 0; upd(); });
    upd();
  }

  // ---------- 교체 물량 ----------
  async function vVolume() {
    const vol = await api("/api/replacement-volume");
    const tot = q => PART_TYPES.reduce((a, p) => a + (q.counts[p.code] || 0), 0);
    const max = Math.max(...vol.quarters.map(tot), 1);
    const checkTot = PART_TYPES.reduce((a, p) => a + (vol.check.counts[p.code] || 0), 0);
    return `<section class="view">
      <div class="panel">
        <h2>기간별 교체 물량</h2>
        <p class="small muted">24개 역 전체, 분기별로 교체 예정일이 오는 부품 수입니다. 예정일이 이미 지났지만 기록이 있는 부품은 이번 분기(${vol.current_quarter})에 넣었습니다.</p>
        <div class="scroll"><table class="vol">
          <tr><th>분기</th>${PART_TYPES.map(p => `<th>${p.name}</th>`).join("")}<th>합계</th><th></th></tr>
          <tr class="checkrow"><td>확인 필요</td>${PART_TYPES.map(p => `<td class="n">${vol.check.counts[p.code] || ""}</td>`).join("")}<td class="n">${checkTot}</td><td class="small muted">교체 여부부터 확인</td></tr>
          ${vol.quarters.map(q => `<tr><td>${q.label}</td>${PART_TYPES.map(p => `<td class="n">${q.counts[p.code] || ""}</td>`).join("")}<td class="n"><b>${q.total.toLocaleString()}</b></td><td class="barcell"><div class="vbar" style="width:${(tot(q) / max * 100).toFixed(1)}%"></div></td></tr>`).join("")}
        </table></div>
        <p class="note">문 수가 임시값(역당 32개)이라 절대 개수는 의미가 없고, 언제 몰리는지를 보는 용도입니다. 같은 날 개통한 역들은 같은 분기에 몰립니다.</p>
      </div>
    </section>`;
  }

  render();
})();
</script>
