  }

  --rail: #3d8fd6; --accent: #6fb0ec; --accent-soft: #1a2a3b; --on-accent: #0b1520;

.headrow { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; }

/* 현황: 교체 예정 + 옆 패널 */
.homegrid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 36px; align-items: start; }

.seg { display: flex; gap: 6px; flex-wrap: wrap; }

.segbtn:hover { border-color: var(--ink); color: var(--ink); }
.segbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
/* 교체 예정 기간 버튼: "1년 안" 아래에 그 기간이 끝나는 날짜와 건수를 함께 적어, 어디까지 보는지 바로 알게 한다 */
/* 기간 버튼은 한 줄을 다 쓰고, 역·부품 선택은 다음 줄에 같이 둔다(선택 하나만 따로 떨어지지 않게) */
.horizon { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-basis: 100%; }
.hbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border-radius: 8px; padding: 5px 12px; line-height: 1.25; text-align: left; }

.items { display: flex; flex-direction: column; border-top: 1px solid var(--line); }

.item:hover { background: var(--surface-2); }
.item .bar { width: 8px; height: 38px; border-radius: 2px; background: var(--line); }
.item.r .bar { background: var(--red); } .item.y .bar { background: var(--amber-dot); } .item.c .bar { background: var(--gray); }
.item .s { font-size: 1.05rem; font-weight: 800; }
.item .p { min-width: 0; } .item .p b { font-weight: 700; } .item .p span { display: block; font-size: 0.8rem; color: var(--muted); }

.item.r .left { color: var(--red); } .item.y .left { color: var(--ink); } .item.c .left { color: var(--gray); }

/* 현황: 교체 예정 표 */
.wtable tr[data-go] { cursor: pointer; }

.wtable .late { color: var(--red); font-weight: 700; }
/* 폰 폭에선 남은 기간이 화면 밖으로 밀리지 않게 대상·예정일 칸을 뺀다(예정일은 남은 기간에 마우스를 올리면 나옴) */
@media (max-width: 640px) { .wtable .opt { display: none; } }
.side { display: flex; flex-direction: column; gap: 18px; }
/* 분기별 교체 물량(현황 오른쪽): 한 계열 막대. 위쪽 4px 둥글게, 막대 사이 간격, 바닥선·축 글자는 옅게 */
.vchart svg { display: block; width: 100%; height: auto; overflow: visible; }
.vchart .bar { fill: var(--rail); pointer-events: none; }
.vchart .bar.now { fill: var(--accent); }

.vchart .hit:hover, .vchart .hit:focus-visible { fill: var(--surface-2); outline: none; }
.vchart text { fill: var(--muted); font-size: 9px; font-family: var(--font-data); }

.recs { display: flex; flex-direction: column; }
.recs .rec { font-size: 0.86rem; padding: 9px 0; border-bottom: 1px solid var(--line); }
.recs .rec b { font-weight: 700; } .recs .rec span { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
.btn.block { align-self: stretch; text-align: center; padding: 11px; }
.labnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.route { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }

.route li::before { content: ""; position: absolute; left: 28px; top: 0; bottom: 0; width: 3px; background: var(--rail); }
.route li:first-child::before { top: 50%; }
.route li:last-child::before { bottom: 50%; }

.st:hover { background: var(--accent-soft); }
.st::before { content: ""; position: absolute; left: 21px; top: 50%; width: 17px; height: 17px; margin-top: -8.5px; border-radius: 50%; background: var(--surface); border: 3px solid var(--rail); box-sizing: border-box; }
.st .name { font-weight: 600; }

.stlayout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; align-items: start; }
.stnav { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); display: flex; flex-direction: column; }
.snav { appearance: none; border: 0; border-bottom: 1px solid var(--line); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 8px 12px; display: flex; flex-direction: column; }
.snav:last-child { border-bottom: 0; }
.snav:hover { background: var(--surface-2); }
.snav[aria-current="page"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.snav b { font-size: 0.9rem; font-weight: 700; }
.snav span { font-size: 0.75rem; color: var(--muted); }
.stmain { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (min-width: 1001px) { .stlayout .switcher { display: none; } }

    <span class="badge" aria-hidden="true">동해</span><h1>스크린도어 교체 관리</h1>
    <span class="asof" id="asof"></span>
    <div class="navbtns"><button class="navbtn" id="nav-back" aria-label="이전 화면으로" title="이전 화면">‹</button><button class="navbtn" id="nav-fwd" aria-label="다음 화면으로" title="다음 화면">›</button></div>
    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-home" role="tab" aria-selected="true">현황</button>
      <button class="tab" id="tab-route" role="tab" aria-selected="false">역</button>
      <button class="tab" id="tab-plan" role="tab" aria-selected="false">교체 계획</button>
      <button class="tab" id="tab-records" role="tab" aria-selected="false">교체 기록</button>
      <button class="tab" id="tab-lab" role="tab" aria-selected="false">주기 근거</button>
    </nav>
    <button class="themebtn" id="theme-btn" type="button" role="switch" aria-checked="false"><span class="theme-label">WHITE MODE</span><span class="sw" aria-hidden="true"><span class="knob"></span></span></button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dw-title" hidden></aside>

<script>
(function () {
  "use strict";

  // ---------- API ----------
  async function api(path) {
    const r = await fetch(path);
    if (!r.ok) {
      // 서버 오류는 {"detail": "..."}로 온다 — 그 JSON을 그대로 보여 주지 않고 문구만 꺼낸다
      const text = await r.text();
      let d; try { d = JSON.parse(text).detail; } catch (e) { d = null; }
      throw new Error(typeof d === "string" ? d : (r.status >= 500 ? "서버 오류가 났습니다. 잠시 뒤 다시 시도하세요." : (path + " 실패")));
    }
    return r.json();
  }
  async function apiPost(path, body) {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(Array.isArray(data.detail) ? data.detail.map(d => d.msg).join(", ") : (data.detail || (path + " 실패")));
    return data;
  }
  async function apiUpload(path, file, fields = {}) {
    const fd = new FormData(); fd.append("file", file);
    Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
    const r = await fetch(path, { method: "POST", body: fd });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = data.detail;
      const msg = d && typeof d === "object" && d.errors ? `${d.message}: ${d.errors.slice(0, 8).join(" / ")}${d.errors.length > 8 ? " ..." : ""}` : (typeof d === "string" ? d : (path + " 실패"));
      throw new Error(msg);
    }
    return data;
  }

  // 부품 종류: 화면 표시용 고정 목록(이름·단위). 값은 아니라 한 번만 받아 둔다
  let PART_TYPES = [], PART = {}, DOOR_PART_CODES = [], STATION_PART_CODES = [];
  async function loadPartTypes() {
    if (PART_TYPES.length) return;
    const [{ part_types }, { today }] = await Promise.all([api("/api/part-types"), api("/api/today")]);
    document.getElementById("asof").textContent = dotDate(today) + " 기준";
    PART_TYPES = part_types;
    PART = Object.fromEntries(PART_TYPES.map(p => [p.code, p]));
    DOOR_PART_CODES = PART_TYPES.filter(p => p.unit === "door").map(p => p.code);
    STATION_PART_CODES = PART_TYPES.filter(p => p.unit === "station").map(p => p.code);
  }

  const REASONS = { fail: "고장", prev: "예방 교체", with: "함께 교체", check: "점검(이상 없음)" };
  const STATE = { 빨강: ["교체 임박", "s-red"], 노랑: ["주의", "s-amber"], 초록: ["안전", "s-green"], 확인_필요: ["확인 필요", "s-check"] };
  const RANK = { 빨강: 0, 확인_필요: 1, 노랑: 2, 초록: 3 };
  // 판정은 주기 계산 결과라 상태색(빨강=교체 임박, 노랑=주의, 초록=안전)을 쓰지 않는다. "안전" 옆에 빨간 "짧음 확실"이 붙어 위험처럼 보였다
  const JUDGE = {
    같음: ["10년과 같음", "s-check", "비중을 어떻게 잡아도 10년과 0.5년 이내로 차이 납니다."],
    짧음_확실: ["10년보다 짧음", "s-info", "원인 비중을 어떻게 잡아도 10년보다 짧습니다."],
    김_확실: ["10년보다 김", "s-check", "원인 비중을 어떻게 잡아도 10년보다 깁니다. 10년보다 늦은 교체는 권고하지 않고 참고로만 보여 줍니다."],
    불확실: ["10년 안팎", "s-check", "원인 비중에 따라 10년보다 짧게도, 길게도 나옵니다."],
    날씨무관: ["날씨 보정 없음", "s-check", "날씨가 수명을 줄인다는 정량 근거를 찾지 못해 제조사 권장 10년을 씁니다."]
  };
  const SRC = {
    DCM: [["Nichicon 콘덴서 수명 계산기", "https://www.nichicon.com/en-us/design-support/lifetime-calculator/"], ["Norris-Landzberg 납땜 피로", "https://accendoreliability.com/norris-landzberg-solder-joint-fatigue/"], ["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    IFM: [["Peck 습도 모델", "https://metricgate.com/docs/peck-temperature-humidity-bias/"]],
    MOTOR: [["NSWC-98 식 14-4 권선 온도 계수", "https://everyspec.com/USN/NSWC/NSWC-98_RELIABILITY_HDBK_SEP1998_55321/"]]
  };

  // ---------- 유틸 ----------
  function fmtDateKR(s) { const [y, m, d] = s.split("-").map(Number); return `${y}년 ${m}월 ${d}일`; }
  function dailyTrips(interval) {
    const SERVICE_SPAN_MIN = 18.5 * 60; // 첫차 05:30~막차 24:00 가정(상세 운행시간표 미확보, 추정)
    const PEAK_MIN = 4 * 60; // 출퇴근 피크 합 4시간(아침·저녁 2시간씩) 가정
    const offpeakMin = SERVICE_SPAN_MIN - PEAK_MIN;
    return Math.round(PEAK_MIN / interval.peak + offpeakMin / interval.offpeak);
  }
  // 북울산(24)의 open_date는 임시값(psd/cycle.py _D4)이라 날짜로 보여 주지 않는다 — 임시값이 지나면 "9월 개통 예정"이 틀린 말이 됐다
  function openLabel(station) { return station.id === 24 ? "미정" : fmtDateKR(station.open_date); }
  function openPlan(station) { return station.id === 24 ? "개통일 미정" : fmtDateKR(station.open_date) + " 개통 예정"; }
  function yr(x) { return x.toFixed(1) + "년"; }
  function dur(days) {
    // 개월은 버림: 반올림하면 185일(주의)도 170일(위험)도 "6개월"이 돼 상태 기준(6개월·1년)과 어긋나 보였다
    const a = Math.abs(days), m = Math.floor(a / 30.44);
    const t = m >= 12 ? Math.floor(m / 12) + "년" + (m % 12 ? " " + (m % 12) + "개월" : "") : (m ? m + "개월" : a + "일");
    return days < 0 ? t + " 지남" : t + " 남음";
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function pill(status) { return `<span class="pill stp ${STATE[status][1]}">${STATE[status][0]}</span>`; }
  function jpill(j) { return `<span class="pill ${JUDGE[j][1]}">${JUDGE[j][0]}</span>`; }
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2400); }
  function worstDoor(doors) { return doors.reduce((a, d) => (RANK[d.worst_status] < RANK[a.worst_status] || (RANK[d.worst_status] === RANK[a.worst_status] && d.worst_days_left < a.worst_days_left)) ? d : a); }
  // 주기 차이(년)를 "1년 2개월"처럼. 부호는 버리고 호출하는 쪽에서 "빨라짐/늦어짐"을 붙인다
  function monthsText(dy) {
    const m = Math.round(Math.abs(dy) * 12);
    return m >= 12 ? Math.floor(m / 12) + "년" + (m % 12 ? " " + (m % 12) + "개월" : "") : m + "개월";
  }
  function dotDate(s) { return s.replaceAll("-", "."); }
  // 가로 막대 비교(항상 0년부터 — 막대 길이로 크기를 비교하므로). rows = [[이름, 년, "b0"|"b1"]], refs = [[년, 이름]].
  // SVG로 그리면 좁은 카드에서 글자까지 같이 줄어 읽기 힘들어서 HTML로 그린다(글자 크기 고정)
  function cmpSvg(rows, refs, aria) {
    const max = Math.max(10.5, ...rows.map(r => r[1]), ...refs.map(r => r[0]));
    const at = v => `calc((100% - 52px) * ${(v / max).toFixed(4)})`;
    const n = rows.length;
    const ov = refs.length ? `<span class="cmp-ov" style="grid-row:1 / ${n + 2}">${refs.map(([v, t]) => `<i style="left:${at(v)}"><em>${esc(t)}</em></i>`).join("")}</span><span class="cmp-hd" style="grid-row:1"></span>` : "";
    const bars = rows.map(([t, v, cls], i) => `<span class="cmp-l" style="grid-row:${i + 2}">${esc(t)}</span><span class="cmp-t" style="grid-row:${i + 2}"><span class="cmp-b ${cls}" style="width:${at(v)}"></span><b>${yr(v)}</b></span>`).join("");
    const axis = `<span class="cmp-t cmp-ax" style="grid-row:${n + 2}">${[0, 5, 10].map(v => `<i style="left:${at(v)}">${v}년</i>`).join("")}</span>`;
    return `<div class="cmp" role="img" aria-label="${esc(aria + ": " + rows.map(r => r[0] + " " + yr(r[1])).join(", "))}">${ov}${bars}${axis}</div>`;
  }
  // 날씨 공식 기준선은 10년과 거의 같으면(날씨 무관 부품) 겹쳐 읽히지 않게 하나로 합친다
  function cycleRefs(formulaYears) {
    return Math.abs(formulaYears - 10) < 0.6 ? [[10, "날씨 공식·권장 10년"]] : [[formulaYears, "날씨 공식 " + yr(formulaYears)], [10, "권장 10년"]];
  }

  // ---------- 화면(해시 라우팅: 뒤로/앞으로 버튼이 각 화면 사이를 오가도록) ----------
  const app = document.getElementById("app");
  function encodeView(v) {
    const q = new URLSearchParams();
    let path;
    switch (v.name) {
      case "station":
        path = `/station/${v.st}`;
        if (v.side) q.set("side", v.side);
        if (v.door != null) q.set("door", v.door);
        if (v.plist) q.set("list", v.plist);  // 부품별 상태 표에서 펼쳐 둘 "문 목록"(부품 코드)
        break;
      case "part":
        path = `/part/${v.partId}`;
        break;
      case "weather":
        path = "/lab/weather";
        if (v.simSt != null) q.set("sim", v.simSt);
        if (v.wpart) q.set("part", v.wpart);
        break;
      case "plan":
        path = "/plan";
        if (v.span && v.span !== "12m") q.set("span", v.span);
        break;
      case "route":
        path = "/route";
        if (v.grid) q.set("v", "grid");
        break;
      case "records":
        path = "/records";
        if (v.rst) q.set("st", v.rst);
        if (v.rpart) q.set("part", v.rpart);
        if (v.rfrom) q.set("from", v.rfrom);
        if (v.rto) q.set("to", v.rto);
        if (v.rreason) q.set("reason", v.rreason);
        if (v.rpage > 1) q.set("page", v.rpage);
        break;
      case "sample":
        path = "/sample";
        break;
      case "work":
        path = "/work";
        if (v.h) q.set("h", v.h);
        if (v.fst) q.set("st", v.fst);
        if (v.fpart) q.set("part", v.fpart);
        break;
      default:
        path = "/home";
        if (v.hs) q.set("s", v.hs);
        if (v.hst) q.set("st", v.hst);
        if (v.hpart) q.set("part", v.hpart);
    }
    if (v.open) q.set("open", v.open);
    const qs = q.toString();
    return "#" + path + (qs ? "?" + qs : "");
  }
  function decodeHash() {
    const v = decodeBase();
    const open = Number(new URLSearchParams(location.hash.split("?")[1] || "").get("open"));
    if (open && v.name !== "part") v.open = open;
    return v;
  }
  const baseKey = v => encodeView({ ...v, open: undefined });
  function decodeBase() {
    const h = location.hash.slice(1) || "/home";
    const [path, qs] = h.split("?");
    const q = new URLSearchParams(qs || "");
    let parts = path.split("/").filter(Boolean);
    if (parts[0] === "lab") parts = parts.slice(1); // 예전 주소(#/weather, #/volume)도 그대로 열리게
    try {
      switch (parts[0]) {
        case "home": {
          const v = { name: "home" };
          if (STATE[q.get("s")]) v.hs = q.get("s");
          if (q.get("st")) v.hst = Number(q.get("st"));
          if (q.get("part")) v.hpart = q.get("part");
          return v;
        }
        case "work": {
          const v = { name: "work" };
          if (q.get("h")) v.h = Number(q.get("h"));
          if (q.get("st")) v.fst = Number(q.get("st"));
          if (q.get("part")) v.fpart = q.get("part");
          return v;
        }
        case "route":
          return q.get("v") === "grid" ? { name: "route", grid: true } : { name: "route" };
        case "records": {
          const v = { name: "records" };
          if (q.get("st")) v.rst = Number(q.get("st"));
          if (q.get("part")) v.rpart = q.get("part");
          if (/^\d{4}-\d{2}-\d{2}$/.test(q.get("from") || "")) v.rfrom = q.get("from");
          if (/^\d{4}-\d{2}-\d{2}$/.test(q.get("to") || "")) v.rto = q.get("to");
          if (REASONS[q.get("reason")]) v.rreason = q.get("reason");
          if (q.get("page")) v.rpage = Number(q.get("page"));
          return v;
        }
        case "sample":
          return { name: "sample" };
        case "station": {
          const st = Number(parts[1]);
          if (!st) break;
          const v = { name: "station", st };
          if (q.get("side")) v.side = q.get("side");
          if (q.get("door")) v.door = Number(q.get("door"));
          if (q.get("list")) v.plist = q.get("list");
          return v;
        }
        case "part": {
          const partId = Number(parts[1]);
          if (!partId) break;
          return { name: "part", partId };
        }
        case "weather": {
          const v = { name: "weather" };
          if (q.get("sim")) v.simSt = Number(q.get("sim"));
          if (q.get("part")) v.wpart = q.get("part");
          return v;
        }
        case "plan":
        case "volume": {  // 예전 주소(#/volume = 분기별 표)는 3년 보기로
          const span = q.get("span") || (parts[0] === "volume" ? "3y" : "12m");
          return { name: "plan", span: PLAN_SPANS.includes(span) ? span : "12m" };
        }
      }
    } catch (e) { /* 잘못된 주소면 현황 화면으로 */ }
    return { name: "home" };
  }
  let view = { name: "home" }, suppressHash = false;
  function go(v) {
    if (v.name === "part") { openPart(v.partId); return; }
    const keep = v.keep;
    view = v;
    render();
    if (!keep) window.scrollTo(0, 0);
    const newHash = encodeView(v);
    if (location.hash !== newHash) { suppressHash = true; location.hash = newHash; }
  }
  window.addEventListener("hashchange", () => {
    if (suppressHash) { suppressHash = false; return; }
    const nv = decodeHash();
    drawerPushed = false;
    // 부품 상세만 열고 닫은 것이면(뒤로 가기 등) 뒤 화면은 다시 그리지 않는다
    if (nv.name !== "part" && baseKey(nv) === baseKey(view)) { view = nv; syncDrawer(); return; }
    // 같은 역 안에서 뒤로/앞으로(문·방향을 바꿨던 것)는 스크롤을 그대로 두고 다시 그린다
    if (nv.name === "station" && view.name === "station" && nv.st === view.st) nv.keep = true;
    view = nv;
    render();
    if (!nv.keep) window.scrollTo(0, 0);
  });
  document.getElementById("tab-home").onclick = () => go({ name: "home" });
  document.getElementById("tab-route").onclick = () => go({ name: "route" });
  document.getElementById("tab-plan").onclick = () => go({ name: "plan" });
  document.getElementById("tab-records").onclick = () => go({ name: "records" });
  document.getElementById("tab-lab").onclick = () => go({ name: "weather" });
  document.getElementById("nav-back").onclick = () => history.back();
  document.getElementById("nav-fwd").onclick = () => history.forward();

  // 화면 밝기 스위치. 한 번도 안 눌렀으면 기기 설정(다크 모드 여부)을 따르고, 누르면 그 값을 이 브라우저에 기억한다
  const themeBtn = document.getElementById("theme-btn");
  const systemDark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light")) === "dark";
  function showTheme() {
    const dark = isDark();
    themeBtn.setAttribute("aria-checked", String(dark));
    themeBtn.querySelector(".theme-label").textContent = dark ? "DARK MODE" : "WHITE MODE";
    themeBtn.title = dark ? "누르면 밝은 화면으로" : "누르면 어두운 화면으로";
  }
  themeBtn.onclick = () => {
    const next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("psd-theme", next); } catch (e) {}
    showTheme();
  };
  systemDark.addEventListener("change", showTheme);
  showTheme();

  const TAB_OF = { home: "home", work: "home", route: "route", station: "route", part: "route", plan: "plan", records: "records", sample: "lab", weather: "lab" };
  // 화면을 빨리 바꾸면 먼저 시작한 느린 화면이 나중에 끝나 새 화면을 덮었다. 가장 최근 것만 그린다
  let renderSeq = 0;
  async function render() {
    const my = ++renderSeq;
    const tab = TAB_OF[view.name];
    ["home", "route", "plan", "records", "lab"].forEach(t => document.getElementById("tab-" + t).setAttribute("aria-selected", String(t === tab)));
    tipEl.hidden = true;
    // 같은 화면을 다시 그릴 때(keep: 방향 바꾸기·거르기·쪽 넘기기 등)는 "불러오는 중…"으로 비우지 않고, 다 그린 뒤
    // 스크롤 위치(창·역 목록·문 줄 가로 스크롤)를 되돌린다 — 비웠다 채우면 화면이 위아래로 튀었다(2026-11-02)
    const keep = view.keep, saved = keep && {
      y: window.scrollY,
      els: [".stnav", ".strip-wrap"].map(sel => { const el = app.querySelector(sel); return el && [sel, el.scrollLeft, el.scrollTop]; }).filter(Boolean),
    };
    if (!keep) app.innerHTML = `<p class="muted" style="padding-top:18px">불러오는 중…</p>`;
    try {
      await loadPartTypes();
      // 예전 주소(#/part/id)로 바로 들어오면 그 부품의 역 상세를 뒤에 깔고 패널로 연다
      if (view.name === "part") {
        const pp = await api(`/api/parts/${view.partId}`);
        if (my !== renderSeq) return;

          return `<button class="stn ${d && d !== "x" ? "hl" : ""}" ${goAttr({ name: "station", st: s.id })} aria-label="${esc(s.name + " · " + label)}" title="${esc(s.name + " · " + label)}"><span class="dot ${d}"></span><span class="nm">${esc(s.name)}</span></button>`;

        <div class="maplegend"><span><i style="background:var(--red)"></i>교체 임박 6개월 안</span><span class="${zeroCls(data.totals.확인_필요)}"><i style="background:var(--gray)"></i>확인 필요</span><span><i style="background:var(--amber-dot)"></i>주의 1년 안</span><span><i style="border:3px solid var(--rail)"></i>안전</span><span><i style="border:2px dashed var(--line)"></i>개통 전</span></div>
      </section>`;

    const recs = rec.records.map(r => `<div class="rec"><b>${esc(r.station_name)}</b> ${r.parts.map(esc).join(", ")} · ${REASONS[r.reason] || esc(r.reason)}<span>${r.replaced_on.replaceAll("-", ".")} · ${esc(r.location)}${r.created_by ? " · " + esc(r.created_by) : ""}</span></div>`).join("");

    return `<section class="view">
      ${map}
      <div class="homegrid">
        ${work}
        <aside class="side">
          ${volumeChart(vol)}
          <div><div class="headrow"><h3>최근 교체 기록</h3><button class="linkbtn" ${goAttr({ name: "records" })}>전체 ${rec.total.toLocaleString()}건 ›</button></div>
            <div class="recs">${recs || `<p class="small muted" style="padding:9px 0">입력된 교체 기록이 없습니다.</p>`}</div></div>
        </aside>
      </div>
    </section>`;
  }

  // ---------- 교체 예정 전체(현황 "전체 보기") ----------
  async function vWork() {
    const h = HORIZONS.some(x => x[0] === view.h) ? view.h : 730;
    const hLabel = HORIZONS.find(x => x[0] === h)[1];
    // 가장 긴 기간(3년)을 한 번 받아 두고 기간별로 잘라 쓴다 — 버튼마다 건수를 미리 보여 주려고.
    // 3년은 윤년이 끼면 1096일이라 넉넉히 받는다
    const [wi, data] = await Promise.all([api("/api/work-items?within_days=1100"), api("/api/stations")]);
    const endOf = d => addMonths(wi.today, HORIZONS.find(x => x[0] === d)[2]);
    // 버튼 기간대로 자른다(2026-11-01: 주의를 늘 넣었더니 "6개월 안"에 11개월 뒤 항목까지 나와 헷갈렸다).
    // 위험·확인 필요는 정의상 6개월 안이거나 이미 지난 것이라 늘 포함한다 — 달력 6개월(181~184일)과
    // 위험 기준(182일)이 하루 이틀 어긋나 위험 항목이 빠지는 일을 막는다.
    const inHorizon = (x, d) => x.status === "빨강" || x.status === "확인_필요" || x.days_left <= daysBetween(wi.today, endOf(d));
    const byFilter = wi.items.filter(x => (!view.fst || x.station_id === view.fst) && (!view.fpart || x.part_type_code === view.fpart));
    const items = byFilter.filter(x => inHorizon(x, h));
    const filtered = byFilter.length !== wi.items.length;
    const opened = data.stations.filter(s => s.in_service);

    const filters = `<div class="filters">
        <div class="horizon"><div class="seg" role="group" aria-label="교체 예정일 기간">${HORIZONS.map(([d, l]) => {
          const n = partsOf(byFilter.filter(x => inHorizon(x, d)));
          return `<button class="segbtn hbtn" aria-pressed="${d === h}" ${goAttr({ ...view, h: d, keep: true })}>${l} 안<small>부품 ${n.toLocaleString()}개</small></button>`;
        }).join("")}</div></div>
        <select id="w-st" aria-label="역으로 거르기"><option value="">모든 역</option>${opened.map(s => `<option value="${s.id}" ${s.id === view.fst ? "selected" : ""}>${s.name}</option>`).join("")}</select>
        <select id="w-part" aria-label="부품으로 거르기"><option value="">모든 부품</option>${PART_TYPES.map(p => `<option value="${p.code}" ${p.code === view.fpart ? "selected" : ""}>${p.name}</option>`).join("")}</select>
      </div>`;
    // 목록이 비면 통째로 사라져 헷갈리므로, 그 자리에 "없음"을 적는다
    const empty = `<div class="items-empty"><b>${filtered ? "고른 조건에" : `${hLabel} 안에`} 교체할 부품이 없습니다.</b></div>`;
    return `<section class="view">
      <nav class="crumbs"><button ${goAttr({ name: "home" })}>현황</button><span>›</span><span>교체 예정 전체</span></nav>
      <h2>교체 예정 전체</h2>
      ${filters}
      <div class="items">${items.length ? items.map(workRow).join("") : empty}</div>
    </section>`;
  }

  // ---------- 역 목록 ----------
  function miniBar(c) {
    const all = c.빨강 + c.확인_필요 + c.노랑 + c.초록;
    if (!all) return "";
    const seg = (n, cls) => n ? `<i class="${cls}" style="width:${(n / all * 100).toFixed(1)}%"></i>` : "";
    return `<span class="mbar" aria-hidden="true">${seg(c.빨강, "r")}${seg(c.확인_필요, "c")}${seg(c.노랑, "y")}</span>`;
  }
  // 역 x 부품 격자(목업의 노선 현황판): 칸마다 그 역·부품에서 가장 급한 상태와 그 예정 연.월
  function routeGrid(stations) {
    const head = `<tr><th>역</th>${PART_TYPES.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr>`;
    const rows = stations.map(s => {
      if (!s.in_service) return `<tr><td><b>${esc(s.name)}</b></td><td colspan="${PART_TYPES.length}" class="muted small">${openPlan(s)}</td></tr>`;
      const cells = PART_TYPES.map(p => {
        const x = s.parts[p.code];
        const tip = `${p.name} · ${STATE[x.status][0]} ${x.counts[x.status]}/${x.total} · ${dotDate(x.due)} (${dur(x.days_left)})`;
        // 안전 칸은 글자만 — 칸이 다 칩이면 위험·주의가 묻힌다
        const ym = dotDate(x.due).slice(0, 7);  // "30.02"는 30.02년으로 읽혀 연도를 다 쓴다(2026-11-02)
        return `<td title="${esc(tip)}">${x.status === "초록" ? `<span class="num muted">${ym}</span>` : `<span class="pill stp ${STATE[x.status][1]} num">${ym}</span>`}</td>`;
      }).join("");
      return `<tr tabindex="0" aria-label="${esc(s.name)} 역 상세 열기" ${goAttr({ name: "station", st: s.id })}><td><b>${esc(s.name)}</b></td>${cells}</tr>`;
    }).join("");
    return `<div class="panel"><p class="small muted">칸마다 그 역·부품에서 가장 급한 상태와 그 예정 연.월(예: 2030.02 = 2030년 2월)입니다. 칸에 마우스를 올리면 그 상태인 부품 수와 남은 기간이, 줄을 누르면 역 상세가 열립니다.</p>
      <div class="scroll"><table class="hgrid">${head}${rows}</table></div></div>`;
  }
  // 격자 위 "눈에 띄는 패턴" 세 장: 여러 역에 걸친 부품, 가장 급한 역, 1년 안 교체가 없는 역
  function routePatterns(stations) {
    const live = stations.filter(s => s.in_service);
    const bad = s => s.counts.빨강 + s.counts.확인_필요 + s.counts.노랑;
    const names = arr => arr.slice(0, 6).map(s => esc(s.name)).join("·") + (arr.length > 6 ? ` 외 ${arr.length - 6}곳` : "");
    const top = PART_TYPES.map(p => ({ p, sts: live.filter(s => s.parts[p.code] && s.parts[p.code].status !== "초록") })).sort((a, b) => b.sts.length - a.sts.length)[0];
    const worstSt = live.reduce((a, s) => (s.counts.빨강 > a.counts.빨강 || (s.counts.빨강 === a.counts.빨강 && bad(s) > bad(a)) ? s : a));
    const calm = live.filter(s => !bad(s));
    const c1 = top && top.sts.length
      ? `<div class="scard"><span class="lab">여러 역에 걸친 부품</span><span class="big">${esc(top.p.name)}<small>${top.sts.length}개 역</small></span><span class="sub">${names(top.sts)} — 교체 임박·주의</span></div>`
      : `<div class="scard"><span class="lab">여러 역에 걸친 부품</span><span class="big">없음</span><span class="sub">1년 안에 교체할 부품이 없습니다.</span></div>`;
    const wc = worstSt.counts;
    const c2 = bad(worstSt)
      ? `<button type="button" class="scard" ${goAttr({ name: "station", st: worstSt.id })}><span class="lab">가장 급한 역</span><span class="big">${esc(worstSt.name)}<small>${[wc.빨강 && `교체 임박 ${wc.빨강}`, wc.확인_필요 && `확인 필요 ${wc.확인_필요}`, wc.노랑 && `주의 ${wc.노랑}`].filter(Boolean).join(" · ")}</small></span><span class="sub">다음 교체 ${dotDate(worstSt.next.due)} ${esc(PART[worstSt.next.part_type_code].name)} · 누르면 역 상세</span></button>`
      : `<div class="scard"><span class="lab">가장 급한 역</span><span class="big">없음</span><span class="sub">교체 임박·주의인 역이 없습니다.</span></div>`;
    const c3 = `<div class="scard"><span class="lab">1년 안 교체 없는 역</span><span class="big">${calm.length}곳<small>운영 중 ${live.length}곳 중</small></span><span class="sub">${calm.length ? names(calm) : "모든 역에 1년 안 교체할 부품이 있습니다."}</span></div>`;
    return `<section class="scards" aria-label="눈에 띄는 패턴">${c1}${c2}${c3}</section>`;
  }
  async function vRoute() {
    const data = await api("/api/stations");
    const item = s => {
      const c = s.counts;
      const b = [c.빨강 ? `<span class="pill stp s-red">임박 ${c.빨강}</span>` : "", c.확인_필요 ? `<span class="pill stp s-check">확인 ${c.확인_필요}</span>` : "", c.노랑 ? `<span class="pill stp s-amber">주의 ${c.노랑}</span>` : ""].join("");
      // in_service가 false면(지금은 북울산) 부품 자체가 없어 counts가 전부 0이다 — "안전"으로
      // 잘못 보여주면 안 된다(코드 리뷰로 찾은 버그). 운영 중 역만 그 fallback을 쓴다.
      const fallback = s.in_service ? '<span class="pill stp s-green">안전</span>' : '<span class="pill s-check">개통 전</span>';
      const meta = s.next ? `다음 교체 ${dotDate(s.next.due)} ${PART[s.next.part_type_code].name} · ${dur(s.next.days_left)}` : openPlan(s);
      return `<li data-name="${esc(s.name)}"><button class="st" ${goAttr({ name: "station", st: s.id })}><span class="body"><span class="name">${s.name}</span><span class="meta">${meta}</span>${miniBar(c)}</span><span class="badges">${b || fallback}</span><span class="chev" aria-hidden="true">›</span></button></li>`;
    };
    const mode = `<div class="seg" role="group" aria-label="보기 방식">${[[false, "목록"], [true, "격자"]].map(([g, l]) => `<button type="button" class="segbtn" aria-pressed="${!!view.grid === g}" ${goAttr({ name: "route", grid: g || undefined, keep: true })}>${l}</button>`).join("")}</div>`;
    const body = view.grid ? routePatterns(data.stations) + routeGrid(data.stations) : `
      <div class="stfilter-wrap"><input type="search" id="st-filter" class="stfilter" placeholder="역 이름으로 찾기 (예: 태화강)" aria-label="역 이름으로 찾기"></div>
      <ul class="route" id="route-list">${data.stations.map(item).join("")}</ul>
      <p class="route-empty" id="route-empty" hidden>"<span id="route-empty-q"></span>" 역이 없습니다.</p>`;
    return `<section class="view">
      <div class="headrow">${legend(data.totals.확인_필요)}${mode}</div>
      ${body}
    </section>`;
  }

  // ---------- 교체 기록(입력·업로드·보고서) ----------
  // 마지막 업로드(또는 되돌리기) 결과. 교체 기록 화면 맨 위에 "무엇이 바뀌었는지"로 보여 준다
  let lastResult = null;
  function changeCard(c, kind) {
    const b = c.before, a = c.after, d = a.years - b.years;
    const tag = Math.abs(d) < 0.05 ? `<span class="pill s-check">주기 변화 거의 없음</span>` : `<span class="pill s-info">교체주기 ${monthsText(d)} ${d < 0 ? "짧아짐" : "길어짐"}</span>`;
    const st = ["빨강", "노랑", "확인_필요", "초록"].filter(s => b.counts[s] || a.counts[s])
      .map(s => `<span>${pill(s)} ${b.counts[s]} → <b>${a.counts[s]}</b></span>`).join("");
    // 2026-11-02 관리자 검토: 숫자만 보면 계산이 틀린 것처럼 보이는 두 경우에 이유를 붙인다
    const moved = STATUS_KEYS.reduce((n, s) => n + Math.max(0, a.counts[s] - b.counts[s]), 0);
    const notes = [
      a.next_due > b.next_due && a.years <= b.years
        && "교체주기는 짧아졌지만, 가장 급하던 부품을 이번에 교체해 새로 시작했기 때문에 가장 빠른 교체는 늦어졌습니다.",
      a.parts > 1 && moved > Math.max(1, a.failures - b.failures)
        && `교체주기는 이 역 ${c.part_name} ${a.parts}개 전체에 함께 적용돼, 기록 몇 건에도 여러 문의 상태가 같이 바뀝니다.`,
    ].filter(Boolean).map(t => `<p class="small muted" style="margin:0">${esc(t)}</p>`).join("");
    return `<div class="chg">
        <div class="chg-title"><h3>${esc(c.station_name)} · ${esc(c.part_name)}</h3>${tag}</div>
        <div class="chg-big" aria-label="교체주기 ${yr(b.years)}에서 ${yr(a.years)}로"><span class="old">${yr(b.years)}</span><span class="arr" aria-hidden="true">→</span><span class="new">${yr(a.years)}</span></div>
        ${cmpSvg([["올리기 전", b.years, "b0"], ["올린 뒤", a.years, "b1"]], cycleRefs(a.formula_years), `${c.station_name} ${c.part_name} 교체주기 비교`)}
        <dl class="facts">
          <dt>고장 기록</dt><dd>${b.failures}건 → <b>${a.failures}건</b> <span class="muted small">(부품 ${a.parts}개)</span></dd>
          <dt>가장 빠른 교체</dt><dd>${dotDate(b.next_due)} → <b>${dotDate(a.next_due)}</b> <span class="muted small">(${dur(a.days_left)})</span></dd>
        </dl>
        <div class="stchg">${st}</div>
        ${notes}
        ${kind === "preview" || kind === "compare" ? "" : `<button class="linkbtn" ${goAttr({ name: "station", st: c.station_id })}>${esc(c.station_name)}역 문별 상태 보기 ›</button>`}
      </div>`;
  }
  // 미리보기(정비기록 시연)·비교(반영 전)는 저장하지 않아 역 화면으로 가면 올리기 전 상태가 보인다 — 그래서 카드에 역 링크를 두지 않는다
  const STATUS_KEYS = ["빨강", "노랑", "확인_필요", "초록"];
  const statusMoved = c => STATUS_KEYS.some(s => c.before.counts[s] !== c.after.counts[s]);
  function resultPanel(r) {
    // 미리보기·비교는 위험·주의·안전이 실제로 바뀐 곳을 먼저 보여 준다(주기만 몇 달 바뀐 곳은 그 뒤, 같은 묶음 안에선 주기 변화 큰 순)
    const ahead = r.kind === "preview" || r.kind === "compare";
    const changes = ahead ? [...r.changes.filter(statusMoved), ...r.changes.filter(c => !statusMoved(c))] : r.changes;
    const shown = changes.slice(0, 6), rest = changes.slice(6);
    const sub = `<p class="small muted">${r.checked ? `교체 ${r.replaced.toLocaleString()}건 · 점검(이상 없음) ${r.checked.toLocaleString()}건 · ` : ""}${esc(r.file || "")}</p>`;
    let summary = "";
    if (ahead) {
      const sum = side => Object.fromEntries(STATUS_KEYS.map(s => [s, r.changes.reduce((n, c) => n + c[side].counts[s], 0)]));
      const b = sum("before"), a = sum("after"), moved = r.changes.filter(statusMoved).length;
      summary = `<div class="stchg"><span><b>상태가 바뀐 곳 ${moved}곳</b></span>${STATUS_KEYS.filter(s => b[s] !== a[s]).map(s => `<span>${pill(s)} ${b[s].toLocaleString()} → <b>${a[s].toLocaleString()}</b></span>`).join("")}</div>`;
    }
    const head = r.kind === "upload" ? `<h2>반영했습니다: ${diffText(r)}</h2><p class="small muted">${esc(r.file)} · 교체주기와 예정일을 다시 계산했습니다</p>`
      : r.kind === "compare" ? `<h2>반영하면 ${r.changes.length}곳의 교체주기가 이렇게 바뀝니다</h2>${summary}`
      : `<h2>${r.inserted.toLocaleString()}건을 올리면 ${r.changes.length}곳의 교체주기가 이렇게 바뀝니다</h2>${sub}${summary}`;
    const restRows = rest.map(c => `<tr><td>${esc(c.station_name)}</td><td>${esc(c.part_name)}</td><td class="num">${yr(c.before.years)} → <b>${yr(c.after.years)}</b></td><td class="num">${dotDate(c.before.next_due)} → ${dotDate(c.after.next_due)}</td></tr>`).join("");
    return `<div class="panel result" id="result">
        <div class="resulthead"><div>${head}</div>${ahead ? "" : `<div class="filters">${r.kind === "upload" && r.batch_id ? `<button class="btn ghost" data-undo="${r.batch_id}" type="button">이 업로드 되돌리기</button>` : ""}<button class="linkbtn" id="res-close" type="button">닫기</button></div>`}</div>
        <div class="chgs">${shown.map(c => changeCard(c, r.kind)).join("")}</div>
        ${rest.length ? `<details class="more"><summary>나머지 ${rest.length}곳 보기</summary><div class="scroll"><table><tr><th>역</th><th>부품</th><th>교체주기</th><th>가장 빠른 교체</th></tr>${restRows}</table></div></details>` : ""}
      </div>`;
  }
  // ---------- 정비기록 시연: 샘플 엑셀(입력)을 올리면 결과가 어떻게 바뀌는지. 미리보기라 저장하지 않는다 ----------
  async function vSample() {
    const s = await api("/api/sample-records");
    const n = {};
    s.rows.forEach(r => { n[r.reason] = (n[r.reason] || 0) + 1; });
    const stations = new Set(s.rows.map(r => r.station_name)).size;
    const rows = s.rows.map(r => `<tr><td>${dotDate(r.replaced_on)}</td><td>${esc(r.station_name)}</td><td>${r.side_label ? `${esc(r.side_label)} ${esc(r.door_no)}` : "종합제어반"}</td><td>${esc(r.parts)}</td><td>${esc(r.reason)}</td><td>${esc(r.created_by || "")}</td></tr>`).join("");
    return `<section class="view">
      ${labNav("sample")}
      <div class="panel">
        <h2>입력: 정비기록 샘플</h2>
        <p class="small muted">${esc(s.file)} · ${s.rows.length.toLocaleString()}건 · ${stations}개 역 · ${Object.entries(n).map(([k, v]) => `${k} ${v}건`).join(" · ")}</p>
        <details class="more"><summary>기록 ${s.rows.length.toLocaleString()}건 보기</summary><div class="scroll"><table><tr><th>날짜</th><th>역</th><th>위치</th><th>부품</th><th>사유</th><th>입력자</th></tr>${rows}</table></div></details>
        <p class="small muted">미리보기라 DB에는 저장하지 않습니다. 실제로 올리려면 교체 기록 탭을 쓰세요.</p>
        <button class="btn" id="sp-run" type="button">올리면 어떻게 바뀌나 보기</button>
      </div>
      <div id="sp-result"></div>
    </section>`;
  }

  // ---------- 교체 기록: 정비기록 엑셀(원본)을 올려 DB를 엑셀에 맞춘다(psd/sync.py) ----------
  const REC_PER_PAGE = 30;
  const n0 = x => x.toLocaleString();
  function diffText(r) {
    const c = r.counts, del = r.deleted;
    return [c.new && `새 기록 ${n0(c.new)}건`, c.changed && `고친 기록 ${n0(c.changed)}건`, del && `지운 기록 ${n0(del)}건`].filter(Boolean).join(" · ") || "바뀐 기록 없음";
  }
  function fmtTime(s) { return s ? dotDate(s.slice(0, 10)) + " " + s.slice(11, 16) : ""; }
  async function vRecords() {
    const page = view.rpage || 1;
    const qs = new URLSearchParams({ limit: REC_PER_PAGE, offset: (page - 1) * REC_PER_PAGE, order: "replaced" });
    if (view.rst) qs.set("station_id", view.rst);
    if (view.rpart) qs.set("part", view.rpart);
    if (view.rfrom) qs.set("date_from", view.rfrom);
    if (view.rto) qs.set("date_to", view.rto);
    if (view.rreason) qs.set("reason", view.rreason);
    const [data, rec, hist] = await Promise.all([api("/api/stations"), api("/api/replacement-records?" + qs), api("/api/upload-batches?limit=10")]);
    const opened = data.stations.filter(s => s.in_service);
    const filtered = !!(view.rst || view.rpart || view.rfrom || view.rto || view.rreason);
    const pages = Math.max(1, Math.ceil(rec.total / REC_PER_PAGE));
    const histRows = hist.batches.map(b => `<tr${b.undone_at ? ` class="muted"` : ""}>
        <td class="num">${fmtTime(b.uploaded_at)}</td><td>${esc(b.uploaded_by || "-")}</td><td>${esc(b.file_name)}</td>
        <td class="num small">${b.station_count}개 역 · ${dotDate(b.scope_from)}~${dotDate(b.scope_to)}</td>
        <td class="num">${n0(b.inserted)}</td><td class="num">${n0(b.updated)}</td><td class="num">${n0(b.deleted)}</td>
        <td>${b.undone_at ? `<span class="pill s-check">되돌림</span>` : b.can_undo ? `<button class="btn ghost" data-undo="${b.id}" type="button" style="padding:4px 10px">되돌리기</button>` : ""}</td></tr>`).join("");
    const pager = pages > 1 ? `<div class="filters" style="justify-content:center">
        <button class="btn ghost" ${page > 1 ? goAttr({ ...view, rpage: page - 1, keep: true }) : "disabled"}>‹ 이전</button>
        <span class="small num">${page} / ${pages}쪽</span>
        <button class="btn ghost" ${page < pages ? goAttr({ ...view, rpage: page + 1, keep: true }) : "disabled"}>다음 ›</button></div>` : "";
    return `<section class="view">
      ${lastResult ? resultPanel(lastResult) : ""}
      <form class="panel form" id="xlsxform" novalidate>
        <div class="headrow"><h2>정비기록 엑셀 올리기</h2><a class="linkbtn" href="/api/replacement-records/template" download>빈 양식 내려받기 ›</a></div>
        <p class="small muted">현장 정비기록 엑셀이 원본입니다. 올리면 지금 기록과 먼저 비교해 보여 주고, "반영하기"를 눌러야 저장합니다. 같은 파일을 다시 올려도 기록이 늘지 않습니다.</p>
        <p class="small"><b>이렇게 쓰면 편합니다:</b> 교체·점검할 때마다 화면에 들어올 필요 없이 현장 엑셀에만 계속 적고, 한 달에 한 번(급한 교체가 있었으면 그때) 그 누적 파일을 통째로 올리세요. 이미 들어간 줄은 "그대로"로 넘어가고 새로 적은 줄만 들어갑니다.</p>
        <label class="drop" id="xf-drop"><input type="file" id="xf-file" accept=".xlsx" class="vh"><b id="xf-name">엑셀 파일을 여기에 끌어다 놓거나, 눌러서 고르세요</b><span class="small muted">.xlsx · 첫 시트만 읽음 · 열: 역, 방향, 문번호, 교체일, 사유, 부품, 입력자</span></label>
        <details class="more"><summary>작성 규칙</summary><ul class="small muted" style="margin:0;padding-left:20px">
          <li>방향은 "부전 방면" 또는 "북울산 방면", 문번호는 "호차-문"(예: 1-1)으로 씁니다.</li>
          <li>역 공통 부품(종합제어반 릴레이)은 방향·문번호를 비워 둡니다.</li>
          <li>사유는 넷 중 하나입니다.
            <b>고장</b> = 고장 나서 바꿈 ·
            <b>예방 교체</b> = 고장 나기 전에 미리 바꿈(예정일이 됐거나 점검에서 상태가 나빠서) ·
            <b>함께 교체</b> = 다른 부품을 고치거나 바꾸는 김에 같이 바꿈(예: 모터를 바꾸며 벨트도 새것으로) ·
            <b>점검(이상 없음)</b> = 바꾸지 않고 점검만 함.
            교체주기 계산에서는 고장만 "그 부품이 수명을 다했다"로 세고, 예방·함께 교체는 "그때까지 멀쩡했다"로 셉니다.</li>
          <li>점검(이상 없음)은 교체일 칸에 점검일을 씁니다. 설치일은 바뀌지 않습니다.</li>
          <li>부품은 쉼표로 여러 개 쓸 수 있습니다(예: "DCM,IFM 릴레이"). "전체"는 그 문의 부품 전부입니다.</li>
          <li>잘못 적은 기록은 엑셀에서 고치거나 지운 뒤 다시 올립니다.</li>
          <li>비교는 파일에 나온 역들의, 파일의 가장 이른 날짜~가장 늦은 날짜 사이 기록하고만 합니다. 누적 파일이면 전체, 한 달 파일이면 그 달만 봅니다.
            한 달 파일에 옛날 기록을 고친 줄을 섞으면 범위가 그 날짜까지 넓어지니, 옛날 기록은 누적 파일에서 고쳐 올리세요.</li>
          <li>한 행이라도 틀리면 아무것도 저장하지 않고, 틀린 행을 모두 알려 줍니다.</li></ul></details>
        <label class="small muted">올리는 사람 <input type="text" id="xf-who" maxlength="50" placeholder="이름(선택) — 업로드 이력에 남습니다" style="min-width:240px"></label>
        <p class="err" id="xf-err" hidden></p>
        <button class="btn" type="submit">비교하기</button>
      </form>
      <div id="cmp"></div>
      <div class="panel">
        <div class="headrow"><h3>업로드 이력</h3><span class="small muted">되돌리기는 가장 최근 업로드부터 차례로 됩니다</span></div>
        ${hist.batches.length ? `<div class="scroll"><table><tr><th>올린 때</th><th>올린 사람</th><th>파일</th><th>비교 범위</th><th>새 기록</th><th>고침</th><th>지움</th><th></th></tr>${histRows}</table></div>` : `<p class="small muted">아직 올린 파일이 없습니다.</p>`}
      </div>
      <div class="panel">
        <div class="headrow"><h3>교체 기록</h3><a class="linkbtn" href="/api/replacement-records/export" download>전체 기록 엑셀로 받기 ›</a></div>
        <div class="filters">
          <select id="rf-st" aria-label="역으로 거르기"><option value="">모든 역</option>${opened.map(s => `<option value="${s.id}" ${view.rst === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select>
          <select id="rf-part" aria-label="부품으로 거르기"><option value="">모든 부품</option>${PART_TYPES.map(t => `<option value="${t.code}" ${view.rpart === t.code ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
          <select id="rf-reason" aria-label="사유로 거르기"><option value="">모든 사유</option>${Object.entries(REASONS).map(([k, l]) => `<option value="${k}" ${view.rreason === k ? "selected" : ""}>${l}</option>`).join("")}</select>
          <label class="small muted">교체일 <input type="date" id="rf-from" value="${view.rfrom || ""}" aria-label="교체일 시작"> ~ <input type="date" id="rf-to" value="${view.rto || ""}" aria-label="교체일 끝"></label>
          ${filtered ? `<button type="button" class="linkbtn" id="rf-clear">조건 지우기</button>` : ""}
          <span class="small muted">${n0(rec.total)}건 · 교체일 최신순</span>
        </div>
        ${rec.records.length ? `<div class="scroll"><table>${recHead}${recRows(rec.records)}</table></div>${pager}` : `<p class="muted">${filtered ? "조건에 맞는 기록이 없습니다." : "입력된 교체 기록이 없습니다."}</p>`}
      </div>
    </section>`;
  }

  // 비교 결과(아직 저장 안 함): 새 기록·고친 기록·엑셀에 없는 기록 + 반영하면 바뀌는 교체주기
  function changedRows(list) {
    const what = r => `${r.parts.map(esc).join(", ")} · ${REASONS[r.reason] || esc(r.reason)}`;
    return list.map(({ before: b, after: a }) => `<tr><td class="num">${dotDate(a.replaced_on)}</td><td>${esc(a.station_name)}</td><td>${esc(a.location)}</td><td class="muted">${what(b)}</td><td><b>${what(a)}</b></td></tr>`).join("");
  }
  function moreNote(shown, total) { return total > shown ? `<p class="small muted">처음 ${n0(shown)}건만 보여 줍니다(전체 ${n0(total)}건).</p>` : ""; }
  function comparePanel(r) {
    const c = r.counts;
    const nothing = !c.new && !c.changed && !c.db_duplicates && !(c.missing && r.delete_missing);
    const notes = [
      c.file_duplicates && `엑셀 안에 똑같은 줄이 ${n0(c.file_duplicates)}개 더 있어 한 번만 넣습니다.`,
      c.db_duplicates && `지금 기록에 두 번 들어간 기록 ${n0(c.db_duplicates)}건은 하나만 남깁니다.`,
    ].filter(Boolean).map(t => `<p class="small">${t}</p>`).join("");
    const missing = c.missing ? `<div class="panel" style="padding:12px;border-color:${r.missing_warn ? "var(--red)" : "var(--line)"}">
        <b>엑셀에 없는 기록 ${n0(c.missing)}건</b>
        <p class="small ${r.missing_warn ? "err" : "muted"}" style="margin:0">${r.missing_warn ? `꽤 많습니다. 다른 역·기간의 파일을 고른 건 아닌지, 엑셀 ${r.scope.from_row}행(${dotDate(r.scope.from)})처럼 동떨어진 날짜 한 줄 때문에 범위가 넓어진 건 아닌지 확인하세요. ` : ""}비교 범위 안에 있는데 이 엑셀에는 없는 기록입니다. 엑셀에서 지운 기록이 맞을 때만 지우세요.</p>
        <details class="more"><summary>${n0(c.missing)}건 보기</summary><div class="scroll"><table>${recHead}${recRows(r.missing)}</table></div>${moreNote(r.missing.length, c.missing)}</details>
        <label class="small"><input type="checkbox" id="cmp-del" ${r.delete_missing ? "checked" : ""}> 이 ${n0(c.missing)}건을 지웁니다</label>
      </div>` : "";
    return `<div class="panel result" id="cmp-panel">
        <div class="resulthead"><div><h2>비교 결과: ${nothing ? "바뀌는 기록이 없습니다" : "아직 저장하지 않았습니다"}</h2>
          <p class="small muted">${esc(r.file)} · 비교 범위 ${r.scope.stations}개 역, ${dotDate(r.scope.from)}(엑셀 ${r.scope.from_row}행) ~ ${dotDate(r.scope.to)}(엑셀 ${r.scope.to_row}행) · 이 범위 밖의 기록은 건드리지 않습니다</p></div>
          <div class="filters">${nothing ? "" : `<button class="btn" id="cmp-apply" type="button">반영하기</button>`}<button class="linkbtn" id="cmp-cancel" type="button">${nothing ? "닫기" : "취소"}</button></div></div>
        <div class="stchg"><span>새 기록 <b>${n0(c.new)}</b>건</span><span>고친 기록 <b>${n0(c.changed)}</b>건</span><span>엑셀에 없는 기록 <b>${n0(c.missing)}</b>건</span><span class="muted">그대로 ${n0(c.same)}건</span></div>
        ${nothing && !c.missing ? `<p class="small muted">이미 반영된 파일입니다.</p>` : ""}
        ${notes}
        ${c.new ? `<details class="more" ${c.new <= 10 ? "open" : ""}><summary>새 기록 ${n0(c.new)}건</summary><div class="scroll"><table>${recHead}${recRows(r.new)}</table></div>${moreNote(r.new.length, c.new)}</details>` : ""}
        ${c.changed ? `<details class="more" open><summary>고친 기록 ${n0(c.changed)}건 (같은 역·문·날짜, 사유나 부품이 다름)</summary><div class="scroll"><table><tr><th>교체일</th><th>역</th><th>위치</th><th>지금</th><th>엑셀</th></tr>${changedRows(r.changed)}</table></div>${moreNote(r.changed.length, c.changed)}</details>` : ""}
        ${missing}
      </div>
      ${r.changes.length ? resultPanel({ kind: "compare", ...r }) : ""}`;
  }

  async function undoBatch(id, btn) {
    if (!confirm("이 업로드를 되돌릴까요?\n그때 넣은 기록은 지우고, 그때 지우거나 고친 기록은 원래대로 돌려놓습니다.")) return;
    btn.disabled = true; btn.textContent = "되돌리는 중...";
    try {
      const r = await apiPost(`/api/upload-batches/${id}/undo`, {});
      lastResult = null;  // 되돌리기는 결과 화면 없이 알림만
      toast(`${r.file} 업로드를 되돌렸습니다 (지움 ${n0(r.deleted)}건 · 다시 넣음 ${n0(r.restored)}건)`);
      go({ name: "records" });
    } catch (ex) { toast(ex.message); btn.disabled = false; btn.textContent = "되돌리기"; }
  }

  function setupUploadForm(f) {
    const fileInput = f.querySelector("#xf-file"), err = f.querySelector("#xf-err"), btn = f.querySelector("button[type=submit]");
    const drop = f.querySelector("#xf-drop"), nameEl = f.querySelector("#xf-name"), box = app.querySelector("#cmp");
    let picked = null;
    try { f.querySelector("#xf-who").value = localStorage.getItem("psd-uploader") || ""; } catch (e) {}
    const pick = file => { picked = file; nameEl.textContent = file ? `${file.name} — "비교하기"를 누르세요` : "엑셀 파일을 여기에 끌어다 놓거나, 눌러서 고르세요"; drop.classList.toggle("has", !!file); err.hidden = true; box.innerHTML = ""; };
    fileInput.addEventListener("change", () => pick(fileInput.files[0] || null));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const file = e.dataTransfer.files[0]; if (file) pick(file); });

    const compare = async del => {
      const r = await apiUpload("/api/replacement-records/compare", picked, { delete_missing: del });
      box.innerHTML = comparePanel(r);
      box.querySelectorAll("[data-go]").forEach(el => el.addEventListener("click", () => go(JSON.parse(el.dataset.go))));
      box.querySelector("#cmp-cancel").addEventListener("click", () => { box.innerHTML = ""; });
      const delBox = box.querySelector("#cmp-del");
      if (delBox) delBox.addEventListener("change", async () => {  // 지우기를 켜고 끄면 교체주기 영향도 달라져 다시 비교한다
        delBox.disabled = true;
        try { await compare(delBox.checked); } catch (ex) { toast(ex.message); delBox.disabled = false; }
      });
      const apply = box.querySelector("#cmp-apply");
      if (apply) apply.addEventListener("click", async () => {
        apply.disabled = true; apply.textContent = "반영하는 중...";
        try {
          const who = f.querySelector("#xf-who").value.trim();
          try { localStorage.setItem("psd-uploader", who); } catch (e) {}  // 다음에 또 적지 않게 이 브라우저에 기억
          const res = await apiUpload("/api/replacement-records/sync", picked, { delete_missing: del, ...(who ? { uploaded_by: who } : {}) });
          if (!res.batch_id) { toast("바뀐 기록이 없습니다."); box.innerHTML = ""; return; }
          lastResult = { kind: "upload", ...res };
          go({ name: "records" });
        } catch (ex) { toast(ex.message); apply.disabled = false; apply.textContent = "반영하기"; }
      });
    };
    f.addEventListener("submit", async e => {
      e.preventDefault();
      if (!picked) { err.textContent = "엑셀 파일을 먼저 고르세요."; err.hidden = false; return; }
      err.hidden = true;
      btn.disabled = true; btn.textContent = "비교하는 중...";
      try {
        await compare(false);
        box.scrollIntoView({ behavior: "smooth", block: "start" });
      } catch (ex) {
        err.textContent = ex.message; err.hidden = false; box.innerHTML = "";
      }
      btn.disabled = false; btn.textContent = "비교하기";
    });
  }

  // ---------- 역 ----------
  const SIDE_LABEL = { U: "부전 방면", D: "북울산 방면" };
  function stationNav(stations, st) {
    return `<nav class="stnav" aria-label="역 바꾸기">${stations.map(x => {
      const c = x.counts, n = c.빨강 + c.확인_필요 + c.노랑;
      const sub = !x.in_service ? "개통 전" : c.빨강 ? `교체 임박 ${c.빨강}` + (c.노랑 ? ` · 주의 ${c.노랑}` : "") : c.확인_필요 ? `확인 필요 ${c.확인_필요}` : c.노랑 ? `주의 ${c.노랑}` : "안전";
      return `<button class="snav" ${x.id === st ? 'aria-current="page"' : ""} ${goAttr({ name: "station", st: x.id })}><b>${esc(x.name)}</b><span>${sub}</span>${n ? miniBar(c) : ""}</button>`;
    }).join("")}</nav>`;
  }
  // 그 부품이 안전이 아닌 문들을 상태·예정일로 묶는다(현황 "교체 예정"의 한 줄 = 여기 한 묶음).
  // 현황에서 "문 12개"를 눌러 와도 어느 문인지 승강장 그림을 방향마다 밀어 가며 찾아야 했다(2026-11-02)
  function doorGroups(x) {
    const groups = [];
    (x.units || []).filter(u => u.status !== "초록").forEach(u => {
      let g = groups.find(g => g.status === u.status && g.due === u.due);
      if (!g) groups.push(g = { status: u.status, due: u.due, days_left: u.days_left, units: [] });
      g.units.push(u);
    });

        <details class="more"><summary>원인별 열화 속도와 비중</summary><div class="scroll"><table><tr><th>고장 원인</th><th>날씨 변수</th><th>열화 속도(평균 대비)</th><th>비중 기본값(범위)</th></tr>
          ${wb.causes.map(r => `<tr><td>${r.name}</td><td>${r.variable}</td><td class="num">${r.af.toFixed(2)}배</td><td class="num">${r.weight_default}</td></tr>`).join("")}</table></div></details>

    const lastRep = history.find(r => r.reason !== "check");
    const baseNote = lastRep && lastRep.replaced_on === p.install_date ? "마지막 교체일" : history.length ? "PSD 설치일(교체 기록 없음, 점검만)" : "PSD 설치일(교체 기록 없음)";
    const hist = history.length ? `<div class="list">${history.map(r => `<div class="row" style="cursor:default"><span class="pill s-check">${REASONS[r.reason]}</span><span class="what">${dotDate(r.replaced_on)}</span><span></span></div>`).join("")}</div>` : `<p class="muted small">기록 없음</p>`;
    const left = days_left < 0 ? `${-days_left}일 지남` : `D-${days_left}`;
    const onStation = view.name === "station" && view.st === part.station_id;
    // 2026-11-02 관리자 검토: 문 하나 고장에 같은 역 문 수십 개 상태가 바뀌는 이유, "고장 N건 반영"이 아래 이력(이 문)과
    // 다른 이유를 화면에 밝히고, 계산식·Peck 모델 같은 용어는 "계산 자세히" 안으로 접었다
    return `<div class="drawer-h">
        <div><span class="small muted">${esc(part.station_name)} · ${esc(part.door_label)}</span><h2 id="dw-title">${esc(part.part_name)}</h2><div class="legend">${pill(status)}</div></div>

          ${cal ? `${cmpSvg([["날씨 공식", cal.formula_years, "b0"], ["기록 반영", cal.years, "b1"]], [[10, "권장 10년"]], "날씨 공식과 기록 반영 교체주기 비교")}` : ""}

          <p class="small">${weather_basis

            : JUDGE.날씨무관[2]}</p>

  }

  // ---------- 날씨 영향 ----------
  const WPARTS = ["DCM", "IFM", "MOTOR"];
  function niceTicks(lo, hi, n) {
    const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
    const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => span / x <= n) || mag * 10;
    const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  }
  function dotCell(v, lo, hi, ref, tipT, tipR, label) {
    const W = 120, H = 22, x = t => (6 + (t - lo) / (hi - lo) * (W - 12)).toFixed(1);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><line class="refl" x1="${x(ref)}" x2="${x(ref)}" y1="3" y2="19"/><circle class="dot" cx="${x(v)}" cy="11" r="4.5"/></svg>`;
  }
  function rangeCell(c, lo, hi, tipT, tipR, label) {
    const W = 120, H = 22, x = t => 6 + (t - lo) / (hi - lo) * (W - 12);
    return `<svg class="mk" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(label)}" ${tipAttr(tipT, tipR)}><line class="axisl" x1="0" x2="${W}" y1="11" y2="11"/><rect class="band" x="${x(c.lo).toFixed(1)}" y="8" width="${Math.max(2, x(c.hi) - x(c.lo)).toFixed(1)}" height="6" rx="3"/><line class="refl" x1="${x(10).toFixed(1)}" x2="${x(10).toFixed(1)}" y1="3" y2="19"/><circle class="dot" cx="${x(c.base).toFixed(1)}" cy="11" r="4.5"/></svg>`;
  }
  function cc(cyc) { return { base: cyc.base_years, lo: cyc.lo_years, hi: cyc.hi_years, j: cyc.judgment }; }
  function scatter(title, stations, key, xLabel, code, fmtX) {
    const W = 440, H = 280, m = { l: 44, r: 16, t: 26, b: 44 };
    const pts = stations.map(s => ({ s, x: s.weather[key], c: cc(s.cycles[code]) }));
    const xs = pts.map(p => p.x), pad = (Math.max(...xs) - Math.min(...xs)) * 0.08 || 1;
    const xlo = Math.min(...xs) - pad, xhi = Math.max(...xs) + pad;
    const ylo = Math.min(9.5, Math.floor(Math.min(...pts.map(p => p.c.lo)) * 2) / 2), yhi = Math.max(10.5, Math.ceil(Math.max(...pts.map(p => p.c.hi)) * 2) / 2);
    const X = v => m.l + (v - xlo) / (xhi - xlo) * (W - m.l - m.r), Y = v => H - m.b - (v - ylo) / (yhi - ylo) * (H - m.t - m.b);
    const f = v => v.toFixed(1);
    const minP = pts.reduce((a, b) => b.c.base < a.c.base ? b : a), maxP = pts.reduce((a, b) => b.c.base > a.c.base ? b : a);
    const lab = p => { const x = X(p.x), right = x > W / 2; return `<text class="lab" x="${f(right ? x - 9 : x + 9)}" y="${f(Y(p.c.base) - 7)}" text-anchor="${right ? "end" : "start"}">${esc(p.s.name)}</text>`; };
    return `<figure><figcaption>${title}</figcaption>
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
        ${niceTicks(ylo, yhi, 5).map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${m.l - 6}" y="${f(Y(v) + 4)}" text-anchor="end">${v}</text>`).join("")}
        ${niceTicks(xlo, xhi, 5).map(v => `<text x="${f(X(v))}" y="${H - m.b + 16}" text-anchor="middle">${v}</text>`).join("")}
        <text x="${(m.l + W - m.r) / 2}" y="${H - 8}" text-anchor="middle">${xLabel}</text>
        <text x="${m.l - 6}" y="14" text-anchor="end">년</text>
        <line class="refl" x1="${m.l}" x2="${W - m.r}" y1="${f(Y(10))}" y2="${f(Y(10))}"/><text x="${W - m.r}" y="${f(Y(10) - 5)}" text-anchor="end">10년</text>
        ${pts.map(p => `<line class="whisker" x1="${f(X(p.x))}" x2="${f(X(p.x))}" y1="${f(Y(p.c.lo))}" y2="${f(Y(p.c.hi))}"/>`).join("")}
        ${pts.map(p => `<circle class="dot" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="4.5"/>`).join("")}
        ${lab(minP)}${minP !== maxP ? lab(maxP) : ""}
        ${pts.map(p => `<circle class="hit" cx="${f(X(p.x))}" cy="${f(Y(p.c.base))}" r="12" tabindex="0" ${tipAttr(p.s.name, [[xLabel, fmtX(p.x)], ["기본 비중 주기", yr(p.c.base)], ["범위", f(p.c.lo) + "–" + f(p.c.hi) + "년"], ["판정", JUDGE[p.c.j][0]]])}/>`).join("")}
      </svg></figure>`;
  }
  function labNav(cur) {
    return `<div class="labnav"><button class="linkbtn" ${goAttr({ name: "home" })}>‹ 관리 화면으로</button><div class="dirtabs" role="group" aria-label="분석 화면">${[["weather", "날씨 영향"], ["sample", "정비기록 시연"]].map(([k, l]) => `<button class="dirtab" aria-pressed="${k === cur}" ${goAttr({ name: k })}>${l}</button>`).join("")}</div></div>`;
  }
  let weatherCache = null;
  const SENS_VARS = [["rh", "습도", "+5%p"], ["temp", "기온", "+1°C"], ["dt", "일교차", "+1°C"]];
  function deltaTag(dy) {
    const m = Math.round(Math.abs(dy) * 12);
    return m ? `${monthsText(dy)} ${dy < 0 ? "빨라짐" : "늦어짐"}` : "영향 없음";
  }
  // 노선을 따라 역마다 한 부품의 교체주기: 10년(제조사 권장)에서 아래로 내려온 막대 끝이 그 역의 주기.
  // 바탕 띠는 같은 AWS 날씨 지점을 쓰는 역 묶음 — 같은 묶음은 날씨가 같아 주기도 같다
  function routeChart(ST, code) {
    const n = ST.length, CW = 40, L = 44, R = 14, T = 46, PH = 200, B = 44;
    const W = L + n * CW + R, H = T + PH + B;
    const vals = ST.map(s => s.cycles[code].base_years);
    const ylo = Math.max(0, Math.floor(Math.min(...vals) - 0.5)), yhi = 10.5;
    const Y = v => T + (yhi - v) / (yhi - ylo) * PH, X = i => L + i * CW + CW / 2, f = v => v.toFixed(1);
    const groups = [];
    ST.forEach((s, i) => { const g = groups[groups.length - 1]; if (g && g.obs === s.observatory) g.end = i; else groups.push({ obs: s.observatory, start: i, end: i, rh: s.weather.RH }); });
    const bands = groups.map((g, k) => {
      const x0 = L + g.start * CW, w = (g.end - g.start + 1) * CW, cx = x0 + w / 2;
      return `<rect class="${k % 2 ? "bandb" : "banda"}" x="${x0}" y="${T - 40}" width="${w}" height="${PH + 40}"/><text class="grp" x="${cx}" y="${T - 26}" text-anchor="middle">${esc(g.obs)}</text><text x="${cx}" y="${T - 12}" text-anchor="middle">${g.rh.toFixed(1)}%</text>`;
    }).join("");
    const ticks = niceTicks(ylo, 10, 4).map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${L - 6}" y="${f(Y(v) + 4)}" text-anchor="end">${v}년</text>`).join("");
    const iMin = vals.indexOf(Math.min(...vals)), iMax = vals.indexOf(Math.max(...vals));
    const marks = ST.map((s, i) => {
      const v = vals[i], x = X(i);
      const lab = i === iMin || i === iMax ? `<text class="v" x="${x}" y="${f(Y(v) + 18)}" text-anchor="middle">${yr(v)}</text>` : "";
      return `<line class="stem" x1="${x}" x2="${x}" y1="${f(Y(10))}" y2="${f(Y(v))}"/><circle class="dot" cx="${x}" cy="${f(Y(v))}" r="5"/>${lab}<text class="nm" x="${x}" y="${T + PH + (i % 2 ? 32 : 16)}" text-anchor="middle">${esc(s.name)}</text>`;
    }).join("");
    const hits = ST.map((s, i) => `<rect class="hit" x="${L + i * CW}" y="${T - 40}" width="${CW}" height="${PH + 40 + B}" tabindex="0" aria-label="${esc(s.name + " " + PART[code].name + " " + yr(vals[i]))}" ${tipAttr(s.name + " · " + PART[code].name, [["교체주기", yr(vals[i])], ["권장 10년보다", monthsText(10 - vals[i]) + " 짧음"], ["습도", s.weather.RH.toFixed(1) + "%"], ["기온", s.weather.T.toFixed(1) + "°C"], ["일교차", s.weather.DT.toFixed(1) + "°C"], ["날씨 지점", "AWS " + s.observatory]])}/>`).join("");
    return `<div class="scroll lolli"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc("역별 " + PART[code].name + " 교체주기")}">
        ${bands}${ticks}
        <line class="ten" x1="${L}" x2="${W - R}" y1="${f(Y(10))}" y2="${f(Y(10))}"/><text x="${W - R}" y="${f(Y(10) - 5)}" text-anchor="end">제조사 권장 10년</text>
        ${marks}${hits}
      </svg></div>`;
  }
  async function vWeather() {
    const [data, sens] = await Promise.all([api("/api/weather-impact"), api("/api/weather-impact/sensitivity")]);
    // 개통 전 역(북울산)은 PSD가 없어 교체주기를 말할 대상이 아니므로 뺀다
    weatherCache = { ...data, stations: data.stations.filter(s => s.in_service) };
    const ST = weatherCache.stations, REF = data.reference;
    const code = WPARTS.includes(view.wpart) ? view.wpart : "IFM";

    const maxAbs = Math.max(...WPARTS.flatMap(c => SENS_VARS.map(([k]) => Math.abs(sens.parts[c][k]))), 0.01);
    const cards = SENS_VARS.map(([k, name, step]) => `<div class="card"><h3>${name} ${step}</h3>
        ${WPARTS.map(c => { const d = sens.parts[c][k], zero = Math.round(Math.abs(d) * 12) === 0; return `<div class="srow ${zero ? "zero" : ""}"><span>${PART[c].name}</span><span class="strk"><span class="sb" style="width:${(Math.abs(d) / maxAbs * 100).toFixed(1)}%"></span></span><span class="sv">${deltaTag(d)}</span></div>`; }).join("")}
      </div>`).join("");

    const partSeg = `<div class="seg" role="group" aria-label="부품 고르기">${WPARTS.map(c => `<button class="segbtn" aria-pressed="${c === code}" ${goAttr({ ...view, wpart: c, keep: true })}>${PART[c].name}</button>`).join("")}</div>`;

    const rh = ST.map(s => s.weather.RH), dt = ST.map(s => s.weather.DT);
    const rhLo = Math.min(...rh) - 1, rhHi = Math.max(...rh) + 1, dtLo = Math.min(...dt) - 0.5, dtHi = Math.max(...dt) + 0.5;
    const all = ST.flatMap(s => WPARTS.map(k => cc(s.cycles[k])));
    const cyLo = Math.min(9.5, Math.floor(Math.min(...all.map(c => c.lo)) * 2) / 2), cyHi = Math.max(10.5, Math.ceil(Math.max(...all.map(c => c.hi)) * 2) / 2);
    const rows = ST.map(s => `<tr><td class="nm">${s.name}</td>
        <td>${dotCell(s.weather.RH, rhLo, rhHi, REF.RH, s.name, [["습도", s.weather.RH.toFixed(1) + "%"], ["24개 역 평균", REF.RH.toFixed(1) + "%"]], s.name + " 습도 " + s.weather.RH.toFixed(1) + "%")}</td>
        <td>${dotCell(s.weather.DT, dtLo, dtHi, REF.DT, s.name, [["일교차", s.weather.DT.toFixed(1) + "°C"], ["24개 역 평균", REF.DT.toFixed(1) + "°C"]], s.name + " 일교차 " + s.weather.DT.toFixed(1) + "°C")}</td>
        ${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td>${rangeCell(c, cyLo, cyHi, s.name + " · " + PART[k].name, [["기본 비중", yr(c.base)], ["범위", c.lo.toFixed(1) + "–" + c.hi.toFixed(1) + "년"], ["판정", JUDGE[c.j][0]]], s.name + " " + PART[k].name + " " + yr(c.base))}</td>`; }).join("")}</tr>`).join("");
    const numRows = ST.map(s => `<tr><td>${s.name}</td><td class="num">${s.weather.T.toFixed(1)}</td><td class="num">${s.weather.RH.toFixed(1)}</td><td class="num">${s.weather.DT.toFixed(1)}</td>${WPARTS.map(k => { const c = cc(s.cycles[k]); return `<td class="num">${c.base.toFixed(1)} (${c.lo.toFixed(1)}–${c.hi.toFixed(1)})</td>`; }).join("")}</tr>`).join("");

    return `<section class="view">
      ${labNav("weather")}
      <p class="small muted">이 화면의 교체주기는 날씨 공식만으로 낸 값입니다(교체 기록 반영 전). 실제 예정일은 교체 기록을 반영한 주기로 계산하므로 역·부품 화면의 값과 다를 수 있습니다.</p>
      <div class="panel">
        <h2>날씨가 한 칸 바뀌면 교체가 얼마나 빨라지나</h2>
        <div class="sens">${cards}</div>
      </div>
      <div class="panel">
        <div class="headrow"><h2>노선을 따라 본 교체주기 <span class="small muted">날씨 공식 기준</span></h2>${partSeg}</div>
        ${routeChart(ST, code)}
      </div>
      ${simPanel(view.simSt ?? ST[0].id)}
      <div class="panel">
        <details class="more"><summary>자세한 표와 그래프(원인 비중 범위 포함)</summary>
          <div class="scroll"><table class="rowchart">
            <tr><th>역</th><th>습도<span class="cap">${rhLo.toFixed(0)}–${rhHi.toFixed(0)}%</span></th><th>일교차<span class="cap">${dtLo.toFixed(1)}–${dtHi.toFixed(1)}°C</span></th>${WPARTS.map(k => `<th>${PART[k].name} 주기<span class="cap">${cyLo}–${cyHi}년</span></th>`).join("")}</tr>
            ${rows}
          </table></div>
          <button class="linkbtn" id="tbltoggle">숫자 표로 보기</button>
          <div class="scroll" id="numtbl" hidden><table><tr><th>역</th><th>기온 °C</th><th>습도 %</th><th>일교차 °C</th>${WPARTS.map(k => `<th>${PART[k].name} 주기(년)</th>`).join("")}</tr>${numRows}</table></div>
          <div class="charts2" style="margin-top:14px">
            ${scatter("습도와 IFM 릴레이 주기", ST, "RH", "평균 습도(%)", "IFM", v => v.toFixed(1) + "%")}
            ${scatter("일교차와 DCM 주기", ST, "DT", "평균 일교차(°C)", "DCM", v => v.toFixed(1) + "°C")}
          </div>
        </details>
      </div>
    </section>`;
  }
  function simPanel(stId) {
    return `<div class="panel" id="sim">
      <h2>이 역 날씨가 바뀌면</h2>
      <div class="filters"><select id="sim-st" aria-label="역">${weatherCache.stations.map(x => `<option value="${x.id}" ${x.id === stId ? "selected" : ""}>${x.id}. ${x.name}</option>`).join("")}</select></div>
      <div class="sliders">
        <div class="field"><label for="sim-rh">습도 변화 <b class="num" id="sim-rh-v">0%p</b></label><input type="range" id="sim-rh" min="-10" max="10" step="1" value="0"><span class="ends"><span>← 더 건조한 날씨</span><span>더 눅눅한 날씨 →</span></span></div>
        <div class="field"><label for="sim-dt">일교차 변화 <b class="num" id="sim-dt-v">0.0°C</b></label><input type="range" id="sim-dt" min="-3" max="3" step="0.5" value="0"><span class="ends"><span>← 낮밤 기온 차 작음</span><span>낮밤 기온 차 큼 →</span></span></div>
        <div class="field"><label for="sim-t">기온 변화 <b class="num" id="sim-t-v">0.0°C</b></label><input type="range" id="sim-t" min="-2" max="2" step="0.5" value="0"><span class="ends"><span>← 더 서늘한 날씨</span><span>더 더운 날씨 →</span></span></div>
      </div>
      <div id="sim-out"><p class="muted small">계산 중…</p></div>
    </div>`;
  }
  function setupSim() {
    const g = id => app.querySelector("#" + id);
    const sign = (v, d) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
    let timer = null, seq = 0;
    const upd = () => {
      clearTimeout(timer);
      const dRH = Number(g("sim-rh").value), dDT = Number(g("sim-dt").value), dT = Number(g("sim-t").value);
      g("sim-rh-v").textContent = sign(dRH, 0) + "%p";
      g("sim-dt-v").textContent = sign(dDT, 1) + "°C";
      g("sim-t-v").textContent = sign(dT, 1) + "°C";
      timer = setTimeout(async () => {
        const my = ++seq;
        const s = weatherCache.stations.find(x => x.id === Number(g("sim-st").value));
        const sim = await api(`/api/weather-impact/simulate?station_id=${s.id}&d_temp=${dT}&d_rh=${dRH}&d_dt=${dDT}`);
        if (my !== seq || !g("sim-out")) return;  // 슬라이더를 빨리 움직이면 늦게 온 옛 응답이 새 결과를 덮지 않게
        const cards = WPARTS.map(k => {
          const a = sim.baseline[k].base_years, b = sim.cycles[k].base_years, d = b - a;
          return `<div class="card"><div class="headrow"><h3>${PART[k].name}</h3><span class="tag">${Math.round(Math.abs(d) * 12) ? "교체 " + deltaTag(d) : "변화 없음"}</span></div>
            ${cmpSvg([["지금 날씨", a, "b0"], ["바꾼 날씨", b, "b1"]], [[10, "권장 10년"]], `${s.name} ${PART[k].name} 지금 날씨와 바꾼 날씨 비교`)}</div>`;
        }).join("");
        const t = s.weather.T + dT, rh = Math.min(100, s.weather.RH + dRH), dt = Math.max(0.5, s.weather.DT + dDT);
        g("sim-out").innerHTML = `<div class="simgrid">${cards}</div>
          <p class="small muted">바꾼 날씨: 기온 ${t.toFixed(1)}°C · 습도 ${rh.toFixed(0)}% · 일교차 ${dt.toFixed(1)}°C</p>`;
      }, 150);
    };
    ["sim-st", "sim-rh", "sim-dt", "sim-t"].forEach(id => g(id).addEventListener("input", upd));
    upd();
  }

  // ---------- 교체 계획: 기간마다 교체 예정 부품 수(자재 발주·작업 배분, 몰리는 때 앞당겨 나눌 역 고르기) ----------
  const PLAN_SPANS = ["12m", "3y", "5y"];
  const SPAN_LABEL = { "12m": ["12개월", "월별"], "3y": ["3년", "분기별"], "5y": ["5년", "연도별"] };
  // 맨 앞 칸은 지금 달·분기·해(남은 기간)라 칸 수가 하나 더 많다(12개월 = 13칸) — 카드 제목에 그대로 밝힌다
  const SPAN_NOW = { month: "이번 달", quarter: "이번 분기", year: "올해" };
  // 축 글자: 해가 바뀌는 칸(과 맨 앞 칸)에만 연도를 붙인다
  function axisLabel(b, i, unit) {
    if (unit === "year") return [String(b.year), ""];
    const first = i === 0 || b.sub === 1;
    return [unit === "month" ? `${b.sub}월` : `${b.sub}분기`, first ? String(b.year) : ""];
  }
  function planChart(B, unit, pi) {
    // 그림 폭을 고정해 기간 수(13칸·6칸)와 상관없이 높이가 같게 한다. 막대는 너무 굵어지지 않게 52까지
    const n = B.length, W = 832, BW = W / n, H = 150, TOP = 18;
    const max = Math.max(...B.map(b => b.total), 1);
    const bars = B.map((b, i) => {
      const x = i * BW, h = b.total ? Math.max(3, b.total / max * (H - TOP)) : 0, y = H - h, w = Math.min(BW - 12, 52), bx = x + (BW - w) / 2, r = Math.min(4, h, w / 2);
      const [l1, l2] = axisLabel(b, i, unit);
      const rows = [...PART_TYPES.filter(p => b.counts[p.code]).map(p => [p.name, b.counts[p.code].toLocaleString() + "개"]), ["합계", b.total.toLocaleString() + "개"]];
      const bar = h ? `<path class="bar ${i === pi ? "pk" : ""}" d="M${bx},${H}V${y + r}Q${bx},${y} ${bx + r},${y}H${bx + w - r}Q${bx + w},${y} ${bx + w},${y + r}V${H}Z"/>` : "";
      return `<rect class="hit" data-pb="${i}" x="${x}" y="0" width="${BW}" height="${H + 30}" rx="3" tabindex="0" role="button" aria-label="${esc(b.label)} ${b.total}개 · 역별 물량 보기" ${tipAttr(b.label, rows)}/>${bar}
        <text class="v" x="${x + BW / 2}" y="${(h ? y : H) - 5}" text-anchor="middle">${b.total ? b.total.toLocaleString() : "–"}</text>
        <text x="${x + BW / 2}" y="${H + 14}" text-anchor="middle">${l1}</text>${l2 ? `<text x="${x + BW / 2}" y="${H + 26}" text-anchor="middle">${l2}</text>` : ""}`;
    }).join("");
    return `<div class="pchart"><svg viewBox="0 -4 ${W} ${H + 34}" role="img" aria-label="기간별 교체 예정 부품 수"><line class="base" x1="0" x2="${W}" y1="${H}" y2="${H}"/>${bars}</svg></div>`;
  }
  // 막대를 누르면 그 기간의 역별 물량으로 바꾼다(다시 받지 않고 미리 그려 둔 것 중 하나만 보임)
  function setupPlan(box) {
    const pick = i => {
      box.querySelectorAll(".sbars[data-pb]").forEach(el => { el.hidden = el.dataset.pb !== String(i); });
      box.querySelectorAll(".pchart .hit").forEach(el => el.classList.toggle("sel", el.dataset.pb === String(i)));
    };
    box.querySelectorAll(".pchart .hit").forEach(el => {
      el.addEventListener("click", () => pick(el.dataset.pb));
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(el.dataset.pb); } });
    });
    pick(box.dataset.peak);
  }
  async function vPlan() {
    const span = PLAN_SPANS.includes(view.span) ? view.span : "12m";
    const plan = await api(`/api/replacement-plan?span=${span}`);
    const B = plan.buckets, [spanName, unitName] = SPAN_LABEL[span];
    const total = B.reduce((a, b) => a + b.total, 0);
    const peak = peakOf(B), pi = peak.total ? B.indexOf(peak) : -1;
    const main = peak.total ? PART_TYPES.reduce((a, p) => ((peak.counts[p.code] || 0) > (peak.counts[a.code] || 0) ? p : a), PART_TYPES[0]) : null;

    const seg = `<div class="seg" role="group" aria-label="기간">${PLAN_SPANS.map(k => `<button type="button" class="segbtn" aria-pressed="${k === span}" ${goAttr({ name: "plan", span: k, keep: true })}>${SPAN_LABEL[k][0]}</button>`).join("")}</div>`;
    const cards = `<section class="scards">
        <div class="scard"><span class="lab">${SPAN_NOW[plan.unit]} + 앞으로 ${spanName}</span><span class="big">${total.toLocaleString()}<small>부품</small></span><span class="sub">${esc(B[0].label)} ~ ${esc(B[B.length - 1].label)} · 교체 후 다음 주기까지 포함</span></div>
        <div class="scard"><span class="lab">가장 몰리는 때</span><span class="big">${peak.total ? esc(peak.label) : "없음"}${peak.total ? `<small>${peak.total.toLocaleString()}개 · ${Math.round(peak.total / total * 100)}%</small>` : ""}</span><span class="sub">${main ? `그중 ${esc(main.name)} ${peak.counts[main.code].toLocaleString()}개` : "이 기간엔 교체 예정이 없습니다."}</span></div>
        <div class="scard ${zeroCls(plan.check.total)}"><span class="lab">${pill("확인_필요")}</span><span class="big">${plan.check.total.toLocaleString()}<small>부품</small></span><span class="sub">기록 없이 예정일이 지나 계획에서 뺐습니다. 교체 여부부터 확인하세요.</span></div>
      </section>`;
    const pk = i => (i === pi ? "pk" : "");
    const rf = plan.recent_failures;
    const table =`<div class="scroll"><table class="vol">
        <tr><th>부품</th>${B.map((b, i) => `<th class="${pk(i)}">${axisLabel(b, i, plan.unit).filter(Boolean).reverse().join(" ")}</th>`).join("")}<th>합계</th><th class="muted" title="예정 교체에는 없는 돌발 고장 — 예비품 수량 참고">지난 1년 고장</th></tr>
        ${PART_TYPES.map(p => `<tr><td>${esc(p.name)}</td>${B.map((b, i) => `<td class="n ${pk(i)}">${b.counts[p.code] || ""}</td>`).join("")}<td class="n"><b>${B.reduce((a, b) => a + b.counts[p.code], 0).toLocaleString()}</b></td><td class="n muted">${rf[p.code] || "–"}</td></tr>`).join("")}
        <tr><td><b>합계</b></td>${B.map((b, i) => `<td class="n ${pk(i)}"><b>${b.total || ""}</b></td>`).join("")}<td class="n"><b>${total.toLocaleString()}</b></td><td class="n muted">${Object.values(rf).reduce((a, n) => a + n, 0) || "–"}</td></tr>
      </table></div>`;
    const sbars = B.map((b, i) => {
      const mx = Math.max(...b.stations.map(s => s.count), 1);
      return `<div class="sbars" data-pb="${i}" hidden>
          <div class="headrow"><h3>${esc(b.label)} 역별 물량</h3><span class="small muted">앞당겨 나눌 역을 고를 때 참고 · 다른 기간은 위 막대를 누르세요</span></div>
          ${b.stations.length ? b.stations.map(s => {
            // 그 역에 챙겨 갈 부품: 막대 밑에 부품별 개수를 적는다(역 합계만으론 무엇을 가져갈지 몰랐다)
            const kinds = PART_TYPES.filter(p => s.parts[p.code]).map(p => `${p.name} ${s.parts[p.code]}`).join(" · ");
            return `<button class="sbar" ${goAttr({ name: "station", st: s.id })} title="${esc(s.name)} 역 화면으로"><span>${esc(s.name)}</span><span class="trk"><i style="width:${(s.count / mx * 100).toFixed(1)}%"></i></span><b class="num">${s.count.toLocaleString()}</b><small class="kinds">${esc(kinds)}</small></button>`;
          }).join("") : `<p class="small muted">이 기간엔 교체 예정이 없습니다.</p>`}
        </div>`;
    }).join("");
    return `<section class="view" id="plan" data-peak="${Math.max(pi, 0)}">
      <div class="headrow"><div><h2>교체 계획</h2><p class="small muted">기간마다 교체 예정일이 오는 부품 수입니다(교체 후 다음 주기 예정까지 포함). 자재 발주와 작업 배분에 씁니다.</p></div>${seg}</div>
      ${cards}
      <div class="panel">
        <div class="headrow"><h3>${unitName} 교체 물량</h3><span class="small muted">막대 위 숫자 = 부품 수${pi >= 0 ? " · 가장 몰리는 때는 주황" : ""}</span></div>
        ${planChart(B, plan.unit, pi)}
      </div>
      <div class="panel"><div class="headrow"><h3>부품별</h3><a class="btn ghost" href="/api/replacement-plan/export?span=${span}" download style="text-decoration:none">엑셀로 받기</a></div>${table}
        <p class="small"><b>이 표는 예정일이 오는 교체만 셉니다.</b> 돌발 고장은 언제 날지 몰라 빠져 있으니, 예비품은 오른쪽 "지난 1년 고장"(고장으로 바꾼 개수)을 참고해 따로 잡으세요.</p>
        <p class="small muted">엑셀에는 부품별·역별·역 x 부품(기간·역·부품·수량 한 줄씩) 시트가 들어 있습니다. 발주서에 옮길 때 쓰세요.</p></div>
      <div class="panel">${sbars}</div>
    </section>`;
  }

  view = decodeHash();
  if (!location.hash) { suppressHash = true; location.hash = encodeView(view); }
  render();
})();
</script>
